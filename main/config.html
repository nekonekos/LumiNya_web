<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LumiNya 的只读博客与文件展示器" />
  <title>LumiNya · 文件展示</title>
  <link rel="stylesheet" href="./css/configview.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button menu-button" id="menuButton" type="button" aria-label="打开文件列表" title="文件列表">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <a class="brand" href="./index.html"><span class="brand-mark">{ }</span> LumiNya · 文件展示</a>
      <div class="topbar-status"><span class="status-dot"></span><span id="connectionText">正在读取目录清单</span></div>
      <button class="icon-button" id="themeButton" type="button" aria-label="切换主题" title="切换主题">◐</button>
      <button class="icon-button help-mobile" id="helpMobileButton" type="button" aria-label="使用说明" title="使用说明">?</button>
    </header>

    <div class="workspace">
      <aside class="activitybar" aria-label="工具栏">
        <button class="activity active" type="button" title="资源管理器">▤</button>
        <button class="activity" type="button" title="文件">◫</button>
        <span class="activity-spacer"></span>
        <button class="activity" id="helpButton" type="button" title="使用说明">?</button>
      </aside>

      <aside class="sidebar">
        <div class="sidebar-heading"><span>资源管理器</span><span class="sidebar-kebab">···</span></div>
        <div class="folder-label">LUMINYA_CFG</div>
        <div class="file-tree" id="fileTree"><div class="loading">正在读取目录…</div></div>
        <div class="sidebar-note"><span class="lock-mini">⌁</span> 只读展示 · 文件由后端更新</div>
      </aside>

      <main class="editor-area">
        <div class="tabbar" id="tabbar"></div>
        <div class="editor-toolbar">
          <div><span class="crumb">LUMINYA_CFG</span><span class="crumb-separator">/</span><strong id="crumbName">欢迎页</strong></div>
          <div class="toolbar-actions"><span class="save-state" id="saveState">只读</span></div>
        </div>
        <section class="editor" aria-label="文件阅读器"><div id="codeView" class="code-view"><div class="loading">正在读取目录清单…</div></div></section>
        <div class="editor-footer"><span id="langLabel">文本</span><span id="lineCount">0 行</span><span>UTF-8</span><span>自动换行</span></div>
      </main>
    </div>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-symbol" id="modalSymbol">!</div><h2 id="modalTitle">需要你的选择</h2><p id="modalMessage"></p>
      <div class="modal-actions" id="modalActions"></div>
    </section>
  </div>
  <script>
    const CONFIG_URL = './cfg/conf.json';
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (text) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const escapeAttr = (text) => text.replace(/"/g, '&quot;');

    const fileIcons = { json: '{}', html: '<h>', xml: '<x>', md: 'M↓', txt: '≡' };
    const fileClasses = { json: 'ficon-json', html: 'ficon-html', xml: 'ficon-xml', md: 'ficon-md', txt: 'ficon-txt' };
    const langLabels = { json: 'JSON', html: 'HTML', xml: 'XML', md: 'Markdown', txt: '纯文本' };

    let manifest = null;
    let activePath = null;
    let activeLang = null;
    let tabs = [];

    function showToast(message, kind = 'normal') {
      const toast = $('#toast'); toast.textContent = message; toast.className = `toast visible ${kind}`;
      window.clearTimeout(showToast.timer); showToast.timer = window.setTimeout(() => toast.classList.remove('visible'), 2800);
    }

    function openModal({ title, message, symbol = '!', actions }) {
      $('#modalTitle').textContent = title; $('#modalMessage').textContent = message; $('#modalSymbol').textContent = symbol;
      const actionBox = $('#modalActions'); actionBox.innerHTML = '';
      actions.forEach(({ label, kind = 'quiet', onClick }) => { const button = document.createElement('button'); button.type = 'button'; button.className = `modal-button ${kind}`; button.textContent = label; button.addEventListener('click', () => { closeModal(); onClick(); }); actionBox.append(button); });
      $('#modalBackdrop').hidden = false;
    }
    function closeModal() { $('#modalBackdrop').hidden = true; }

    // 从 URL 查询参数中读取目标文件（支持 ?file= 与 ?path= 两种写法）
    function getUrlFileParam() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('file') ?? params.get('path');
      if (!raw) return null;
      try { return decodeURIComponent(raw); } catch { return raw; }
    }

    function fileExists(path) {
      return (manifest?.files || []).some((file) => file.path === path);
    }

    function typeOfPath(path) {
      const ext = path.split('.').pop().toLowerCase();
      return ['txt', 'html', 'xml', 'json', 'md'].includes(ext) ? ext : 'txt';
    }

    function buildFolderTree() {
      const root = { dirs: {}, files: [] };
      (manifest.files || []).forEach((file) => {
        const segments = file.path.split('/');
        let node = root;
        segments.forEach((segment, index) => {
          const isLast = index === segments.length - 1;
          if (isLast) { node.files.push(file); return; }
          node.dirs[segment] = node.dirs[segment] || { dirs: {}, files: [] };
          node = node.dirs[segment];
        });
      });
      return root;
    }

    function renderTree() {
      const root = buildFolderTree();
      const container = $('#fileTree');
      const renderDir = (dir, depth) => {
        const fragment = document.createDocumentFragment();
        Object.keys(dir.dirs).sort().forEach((name) => {
          const folderButton = document.createElement('button');
          folderButton.type = 'button'; folderButton.className = 'tree-folder';
          folderButton.style.setProperty('--depth', depth);
          folderButton.innerHTML = `<span class="tree-chevron">⌄</span><span class="ficon ficon-folder">▸</span><span class="tree-name">${escapeHtml(name)}</span>`;
          const children = document.createElement('div'); children.className = 'tree-children';
          children.append(renderDir(dir.dirs[name], depth + 1));
          folderButton.addEventListener('click', () => {
            const collapsed = children.classList.toggle('collapsed');
            folderButton.querySelector('.tree-chevron').textContent = collapsed ? '›' : '⌄';
            folderButton.querySelector('.ficon').textContent = collapsed ? '▸' : '▾';
          });
          fragment.append(folderButton, children);
        });
        dir.files.forEach((file) => {
          const lang = typeOfPath(file.path);
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'tree-file'; button.dataset.path = file.path;
          button.style.setProperty('--depth', depth);
          button.innerHTML = `<span class="tree-chevron"></span><span class="ficon ${fileClasses[lang] || ''}">${fileIcons[lang] || '·'}</span><span class="tree-name">${escapeHtml(file.path.split('/').pop())}</span>`;
          button.addEventListener('click', () => openFile(file.path));
          fragment.append(button);
        });
        return fragment;
      };
      container.replaceChildren(renderDir(root, 0));
    }

    function tokenizeJson(code) {
      const tokens = [];
      const push = (cls, start, end) => { if (end > start) tokens.push({ cls, start, end }); };
      let i = 0;
      while (i < code.length) {
        const char = code[i];
        if (char === '"') {
          let j = i + 1;
          while (j < code.length && code[j] !== '"') { if (code[j] === '\\') j++; j++; }
          const isKey = i > 0 && /[\[{,]\s*$/.test(code.slice(0, i));
          push(isKey ? 'key' : 'str', i, Math.min(j + 1, code.length));
          i = j + 1;
        } else if (/[0-9]/.test(char) || (char === '-' && /[0-9]/.test(code[i + 1] || ''))) {
          const match = code.slice(i).match(/^-?\d+(\.\d+)?([eE][+-]?\d+)?/);
          push('num', i, i + match[0].length); i += match[0].length;
        } else if (code.startsWith('true', i) || code.startsWith('false', i) || code.startsWith('null', i)) {
          const word = code.startsWith('true', i) ? 'true' : code.startsWith('false', i) ? 'false' : 'null';
          push('bool', i, i + word.length); i += word.length;
        } else { push('punct', i, i + 1); i++; }
      }
      return tokens;
    }

    function tokenizeXml(code) {
      const tokens = [];
      const push = (cls, start, end) => { if (end > start) tokens.push({ cls, start, end }); };
      let i = 0;
      while (i < code.length) {
        const char = code[i];
        if (code.startsWith('<!--', i)) { const end = code.indexOf('-->', i + 4); const stop = end === -1 ? code.length : end + 3; push('comment', i, stop); i = stop; continue; }
        if (char === '<') {
          const close = code.indexOf('>', i);
          const stop = close === -1 ? code.length : close + 1;
          const tagBody = code.slice(i + 1, close === -1 ? code.length : close);
          const tagMatch = tagBody.match(/^\/?\s*([A-Za-z0-9._-]+)/);
          if (tagMatch) {
            const nameStart = i + 1 + (tagBody.startsWith('/') ? 1 : 0) + (tagBody.indexOf(tagMatch[1]) - (tagBody.startsWith('/') ? 1 : 0));
            push('punct', i, nameStart);
            push('tag', nameStart, nameStart + tagMatch[1].length);
            const rest = code.slice(nameStart + tagMatch[1].length, stop);
            let offset = nameStart + tagMatch[1].length;
            const attrRe = /([A-Za-z0-9._:-]+)(\s*=\s*"[^"]*")?/g;
            let attrMatch;
            while ((attrMatch = attrRe.exec(rest))) {
              const attrStart = offset + attrMatch.index;
              push('attr', attrStart, attrStart + attrMatch[1].length);
              if (attrMatch[2]) push('str', attrStart + attrMatch[1].length, attrStart + attrMatch[0].length);
            }
            push('punct', stop - 1, stop);
          } else { push('tag', i, stop); }
          i = stop;
        } else { push('punct', i, i + 1); i++; }
      }
      return tokens;
    }

    function highlightMd(line) {
      if (/^\s{0,3}#{1,6}\s/.test(line)) return `<span class="hl-md-heading">${escapeHtml(line)}</span>`;
      const bullet = line.replace(/^(\s*)([-*+]\s+)(.*)$/, (m, a, b, rest) => `${escapeHtml(a)}<span class="hl-md-bullet">${escapeHtml(b)}</span>${highlightMdInline(rest)}`);
      if (bullet !== line) return bullet;
      if (/^\s*&gt;/.test(line)) return `<span class="hl-comment">${escapeHtml(line)}</span>`;
      return highlightMdInline(line);
    }
    function highlightMdInline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, '<span class="hl-md-code">$1</span>')
        .replace(/\*\*([^*]+)\*\*/g, '<span class="hl-md-bold">$1</span>')
        .replace(/(^|[^*])\*([^*]+)\*/g, '$1<span class="hl-md-italic">$2</span>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (match, label, href) => {
          if (/^https?:\/\//i.test(href)) {
            return `<a class="hl-md-url" href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
          }
          return `<span class="hl-md-link">${label}</span>`;
        })
        .replace(/(https:\/\/[^\s<>"']+)/g, '<a class="hl-md-url" href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function renderCode(lang, text) {
      const view = $('#codeView');
      view.classList.remove('is-welcome');
      const fragment = document.createDocumentFragment();
      const lines = text.replace(/\r\n/g, '\n').split('\n');
      lines.forEach((lineText, index) => {
        const line = document.createElement('div'); line.className = 'code-row';
        const no = document.createElement('span'); no.className = 'line-no'; no.textContent = String(index + 1);
        const content = document.createElement('div'); content.className = 'code-content';
        if (lang === 'json') { content.innerHTML = highlightLine(lineText, tokenizeJson(lineText)); }
        else if (lang === 'xml' || lang === 'html') { content.innerHTML = highlightLine(lineText, tokenizeXml(lineText)); }
        else if (lang === 'md') { content.innerHTML = highlightMd(lineText); }
        else { content.textContent = lineText; }
        line.append(no, content); fragment.append(line);
      });
      view.replaceChildren(fragment);
      $('#lineCount').textContent = `${lines.length} 行`;
      $('#langLabel').textContent = langLabels[lang] || '文本';
    }
    function highlightLine(code, segments) {
      let index = 0; let html = '';
      segments.forEach((segment) => { html += escapeHtml(code.slice(index, segment.start)); html += `<span class="hl-${segment.cls}">${escapeHtml(code.slice(segment.start, segment.end))}</span>`; index = segment.end; });
      html += escapeHtml(code.slice(index));
      return html;
    }

    function renderWelcome() {
      const view = $('#codeView');
      view.classList.add('is-welcome');
      const wrap = document.createElement('div'); wrap.className = 'welcome';
      const hero = document.createElement('div'); hero.className = 'welcome-hero';
      hero.innerHTML = `<div class="welcome-logo">{ }</div><h1>${escapeHtml(manifest.site || '文件展示')}</h1><p>只读 · 仿 VS Code 的博客与文件展示器</p><p class="welcome-sub">目录清单由 conf.json 枚举 · ${escapeHtml(manifest.generatedAt || '')}</p>`;
      wrap.append(hero);
      const section = document.createElement('div'); section.className = 'welcome-section';
      section.innerHTML = '<h2>文件</h2>';
      const grid = document.createElement('div'); grid.className = 'welcome-grid';
      (manifest.files || []).forEach((file) => {
        const lang = typeOfPath(file.path);
        const card = document.createElement('button'); card.type = 'button'; card.className = 'welcome-card';
        card.innerHTML = `<span class="welcome-card-icon">${fileIcons[lang] || '·'}</span><span class="welcome-card-body"><span class="welcome-card-title">${escapeHtml(file.path)}</span><span class="welcome-card-note">${escapeHtml(file.note || '')}</span></span><span class="welcome-card-badge">${escapeHtml(lang)}</span>`;
        card.addEventListener('click', () => openFile(file.path));
        grid.append(card);
      });
      section.append(grid); wrap.append(section);
      view.replaceChildren(wrap);
      $('#lineCount').textContent = `${manifest.files.length} 个文件`;
      $('#langLabel').textContent = '欢迎页';
    }

    function renderNotFound(requestedPath) {
      const view = $('#codeView');
      view.classList.remove('is-welcome');
      const wrap = document.createElement('div');
      wrap.className = 'not-found';
      wrap.innerHTML = `
        <div class="nf-symbol">⚠</div>
        <h1>文件未找到</h1>
        <p class="nf-desc">没有这个文件或路径不正确</p>
        <p class="nf-path">${escapeHtml(requestedPath || '')}</p>
        <div class="nf-available">
          <h2>可用的文件</h2>
          <ul class="not-found-list"></ul>
        </div>
        <div class="nf-actions"><button type="button" class="nf-button primary" id="nfBackBtn">返回欢迎页</button></div>`;
      const list = wrap.querySelector('.not-found-list');
      (manifest.files || []).forEach((file) => {
        const lang = typeOfPath(file.path);
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML = `<span class="ficon ${fileClasses[lang] || ''}">${fileIcons[lang] || '·'}</span><span>${escapeHtml(file.path)}</span>`;
        btn.addEventListener('click', () => openFile(file.path));
        li.append(btn);
        list.append(li);
      });
      wrap.querySelector('#nfBackBtn').addEventListener('click', () => {
        activePath = '__welcome__';
        renderWelcome();
        renderTabs();
        setActiveTree(null);
        $('#crumbName').textContent = '欢迎页';
      });
      view.replaceChildren(wrap);
      $('#crumbName').textContent = '文件未找到';
      $('#lineCount').textContent = '文件未找到';
      $('#langLabel').textContent = '404';
    }

    // 处理初始 URL 参数：存在则打开，不存在则给出清晰 fallback
    function handleInitialFile() {
      const requested = getUrlFileParam();
      if (!requested) return;
      if (fileExists(requested)) {
        openFile(requested);
      } else {
        renderNotFound(requested);
        showToast('没有这个文件或路径不正确', 'error');
      }
    }

    function renderTabs() {
      const bar = $('#tabbar'); bar.innerHTML = '';
      tabs.forEach((path) => {
        const tab = document.createElement('div'); tab.className = 'tab' + (path === activePath ? ' active' : '');
        tab.innerHTML = `<span class="file-icon ${fileClasses[typeOfPath(path)] || ''}">${fileIcons[typeOfPath(path)] || '·'}</span><span class="tab-name">${escapeHtml(path.split('/').pop())}</span><button type="button" aria-label="关闭标签页">×</button>`;
        tab.querySelector('.tab-name').addEventListener('click', () => openFile(path));
        tab.querySelector('button').addEventListener('click', (event) => { event.stopPropagation(); closeTab(path); });
        bar.append(tab);
      });
    }

    function setActiveTree(path) {
      document.querySelectorAll('#fileTree .tree-file').forEach((node) => node.classList.toggle('active', node.dataset.path === path));
    }

    async function openFile(path) {
      if (path === '__welcome__') { activePath = '__welcome__'; activeLang = null; renderWelcome(); renderTabs(); setActiveTree(null); $('#crumbName').textContent = '欢迎页'; return; }
      try {
        const response = await fetch('./cfg/' + path, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const text = await response.text();
        const lang = typeOfPath(path);
        activePath = path; activeLang = lang;
        if (!tabs.includes(path)) tabs.push(path);
        renderCode(lang, text); renderTabs(); setActiveTree(path);
        $('#crumbName').textContent = path.split('/').pop();
        closeSidebar();
      } catch (error) {
        renderNotFound(path);
        showToast('没有这个文件或路径不正确', 'error');
      }
    }

    function closeTab(path) {
      tabs = tabs.filter((item) => item !== path);
      if (path === activePath) {
        if (tabs.length) { openFile(tabs[tabs.length - 1]); }
        else { activePath = '__welcome__'; activeLang = null; renderWelcome(); renderTabs(); setActiveTree(null); $('#crumbName').textContent = '欢迎页'; }
      } else { renderTabs(); }
    }

    async function loadManifest() {
      try {
        const response = await fetch(CONFIG_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        manifest = await response.json();
        $('#connectionText').textContent = `目录清单 · ${manifest.files.length} 个文件`;
        renderTree();
        renderWelcome();
        $('#tabbar').innerHTML = '';
        handleInitialFile();
      } catch (error) {
        $('#connectionText').textContent = '目录清单读取失败';
        $('#fileTree').innerHTML = '<div class="loading error">无法读取 cfg/conf.json</div>';
        $('#codeView').innerHTML = '<div class="loading error">无法读取 cfg/conf.json，请通过本地服务器打开此页面。</div>';
        showToast('读取目录清单失败：' + error.message, 'error');
      }
    }

    function openSidebar() { document.body.classList.add('sidebar-open'); $('#sidebarBackdrop').hidden = false; }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); $('#sidebarBackdrop').hidden = true; }

    $('#menuButton').addEventListener('click', () => {
      if (document.body.classList.contains('sidebar-open')) closeSidebar(); else openSidebar();
    });
    $('#sidebarBackdrop').addEventListener('click', closeSidebar);

    $('#helpButton').addEventListener('click', showHelp);
    $('#helpMobileButton').addEventListener('click', showHelp);
    function showHelp() { openModal({ title: '只读文件展示器', message: '把 txt / html / xml / json / md 文件放进 main/cfg 文件夹，再在 main/cfg/conf.json 中枚举文件路径即可。本页是只读的，无法修改文件，并自动换行显示代码。', symbol: '?', actions: [{ label: '明白了', kind: 'primary', onClick: () => {} }] }); }
    $('#themeButton').addEventListener('click', () => document.body.classList.toggle('light-theme'));
    $('#modalBackdrop').addEventListener('click', (event) => { if (event.target.id === 'modalBackdrop') closeModal(); });

    loadManifest();
  </script>
</body>
</html>
