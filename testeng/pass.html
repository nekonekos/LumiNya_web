<\!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>testeng · 备用状态页</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --success: #16a34a;
      --success-soft: #ecfdf3;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #ecfdf3 0%, #f8fafc 100%);
      color: var(--text);
    }
    .card {
      width: min(100%, 520px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      padding: 32px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      color: white;
      background: var(--success);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">✓ 状态已就绪</div>
    <h1>提示界面已关闭</h1>
    <p>当前备用页可用于后续扩展或跳转测试，界面已经重新搭好，后续可以继续补充内容。</p>
    <a class="btn" href="./test.html">返回测试页</a>
  </main>
</body>
</html>
