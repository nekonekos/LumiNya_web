<\!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英语688词汇服务</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #3b82f6;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
      padding: 32px 28px;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.7rem;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }
    .contact {
      margin-top: 18px;
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>英语688词汇服务已关闭</h1>
    <p>若您是使用者，请联系系统管理员：QQ：1686157307</p>
    <div class="contact">感谢您的理解</div>
  </main>
</body>
</html>
