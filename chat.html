<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>LumiNya · 智能伙伴</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    /* 全局布局重置，仿微信全屏 */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
    }
    #app {
      width: 100%;
      height: 100%;
      max-width: 1000px;
      display: flex;
      background: var(--bg-soft);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(0,0,0,0.1);
      border-radius: 0;
      overflow: hidden;
      position: relative;
    }
    @media (min-width: 768px) {
      #app { border-radius: 24px; height: 90vh; }
    }

    /* 联系人列表（左侧或全屏） */
    .contact-list {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-light);
      transition: transform 0.3s;
      position: absolute;
      top: 0; left: 0; z-index: 5;
    }
    @media (min-width: 768px) {
      .contact-list {
        position: relative;
        width: 320px;
        min-width: 320px;
        transform: none !important;
        border-right: 1px solid var(--border-light);
      }
    }
    .contact-list.hidden-mobile {
      transform: translateX(-100%);
    }
    .contact-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      border-bottom: 1px solid var(--border-light);
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(16px);
    }
    .contact-header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      background: var(--hero-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .add-btn {
      background: var(--btn-gradient);
      border: none;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .add-btn:active { transform: scale(0.9); }
    .contact-items {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem;
      border-radius: 16px;
      margin-bottom: 0.3rem;
      cursor: pointer;
      transition: background 0.2s;
      color: var(--text-dark);
    }
    .contact-item:hover, .contact-item.active {
      background: rgba(107,159,212,0.15);
    }
    .contact-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--btn-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #fff;
      flex-shrink: 0;
    }
    .contact-info {
      flex: 1;
      overflow: hidden;
    }
    .contact-name {
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .contact-last-msg {
      font-size: 0.8rem;
      color: var(--text-medium);
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 聊天窗口（右侧或全屏） */
    .chat-window {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: transparent;
      position: absolute;
      top: 0; left: 0;
      transform: translateX(100%);
      transition: transform 0.3s;
      z-index: 10;
    }
    @media (min-width: 768px) {
      .chat-window {
        position: relative;
        flex: 1;
        transform: none !important;
        border-left: none;
      }
    }
    .chat-window.active-mobile {
      transform: translateX(0);
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border-light);
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(16px);
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-dark);
      padding: 0 0.3rem;
      display: none;
    }
    @media (max-width: 767px) {
      .back-btn { display: block; }
    }
    .chat-header .avatar-small {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--btn-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
    }
    .chat-header .chat-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-dark);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 20%);
    }
    .msg {
      max-width: 75%;
      padding: 0.7rem 1rem;
      border-radius: 18px;
      word-break: break-word;
      line-height: 1.5;
      font-size: 0.95rem;
      animation: fadeIn 0.2s ease;
      position: relative;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--btn-gradient);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--widget-bg);
      backdrop-filter: blur(6px);
      color: var(--text-dark);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-light);
    }
    .chat-input-area {
      display: flex;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-light);
    }
    .chat-input-area input {
      flex: 1;
      background: var(--widget-bg);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
    }
    .chat-input-area input:focus { border-color: var(--primary-blue); }
    .send-btn {
      background: var(--btn-gradient);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .send-btn:active { transform: scale(0.9); }

    /* 右键菜单 */
    .context-menu {
      position: fixed;
      background: var(--widget-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 0.4rem 0;
      z-index: 999;
      min-width: 120px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      display: none;
    }
    .context-menu .menu-item {
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-dark);
    }
    .context-menu .menu-item:hover { background: rgba(107,159,212,0.15); }

    /* 遮罩 & 添加智能体弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--widget-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 1.5rem;
      width: 90%;
      max-width: 400px;
      color: var(--text-dark);
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h3 { margin-bottom: 1rem; }
    .modal input, .modal textarea {
      width: 100%;
      padding: 0.6rem;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      background: var(--bg-soft);
      color: var(--text-dark);
      margin-bottom: 0.8rem;
    }
    .modal textarea { height: 80px; resize: vertical; }
    .modal-buttons {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
    }
    .btn {
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--btn-gradient); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text-dark); }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .preset-item {
      background: rgba(107,159,212,0.1);
      padding: 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .preset-item:hover { background: rgba(107,159,212,0.2); }
  </style>
</head>
<body>
<div id="app">
  <!-- 联系人列表 -->
  <div class="contact-list" id="contactList">
    <div class="contact-header">
      <h2>智能伙伴</h2>
      <button class="add-btn" id="showAddMenuBtn">+</button>
    </div>
    <div class="contact-items" id="contactItems"></div>
  </div>

  <!-- 聊天窗口 -->
  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="avatar-small" id="chatAvatar"></div>
      <div class="chat-title" id="chatTitle"></div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="说点什么..." autocomplete="off" />
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<!-- 右键菜单 -->
<div class="context-menu" id="contextMenu"></div>

<!-- 添加智能体模态 -->
<div class="modal-overlay" id="addModal" style="display:none;">
  <div class="modal" id="addModalContent">
    <h3>添加智能伙伴</h3>
    <div id="addMenuOptions">
      <button class="btn btn-outline" id="fromPresetBtn">从预设添加</button>
      <button class="btn btn-outline" id="customBtn" style="margin-left:0.5rem;">自定义创建</button>
    </div>
    <div id="presetListContainer" style="display:none;"></div>
    <div id="customForm" style="display:none;">
      <input type="text" id="agentName" placeholder="名称" />
      <textarea id="agentPrompt" placeholder="角色设定 (System Prompt)"></textarea>
      <div class="modal-buttons">
        <button class="btn btn-outline" id="cancelCustomBtn">取消</button>
        <button class="btn btn-primary" id="saveCustomBtn">保存</button>
      </div>
    </div>
    <button class="btn btn-outline" id="closeAddModalBtn" style="margin-top:1rem;">关闭</button>
  </div>
</div>

<script>
  (function() {
    const DEEPSEEK_API = 'https://api.deepseek.com/v1/chat/completions';
    let agents = [];              // 所有智能体 [{id, name, avatar, prompt, createdAt}]
    let messages = {};           // 对话记录 { agentId: [{role, content, time}] }
    let currentAgentId = null;
    let userApiKey = localStorage.getItem('luminya_apikey') || '';
    let PERSONAS = null;         // 从 prompt.json 加载

    // DOM
    const contactItems = document.getElementById('contactItems');
    const chatWindow = document.getElementById('chatWindow');
    const chatMessages = document.getElementById('chatMessages');
    const chatTitle = document.getElementById('chatTitle');
    const chatAvatar = document.getElementById('chatAvatar');
    const messageInput = document.getElementById('messageInput');
    const backBtn = document.getElementById('backBtn');
    const sendBtn = document.getElementById('sendBtn');
    const contextMenu = document.getElementById('contextMenu');

    // 加载数据
    function loadAgents() {
      const raw = localStorage.getItem('luminya_agents');
      agents = raw ? JSON.parse(raw) : [];
    }
    function saveAgents() {
      localStorage.setItem('luminya_agents', JSON.stringify(agents));
    }
    function loadMessages() {
      const raw = localStorage.getItem('luminya_messages');
      messages = raw ? JSON.parse(raw) : {};
    }
    function saveMessages() {
      localStorage.setItem('luminya_messages', JSON.stringify(messages));
    }
    function getAgentMessages(agentId) {
      return messages[agentId] || [];
    }

    // 渲染联系人列表
    function renderContactList() {
      contactItems.innerHTML = '';
      agents.forEach(agent => {
        const div = document.createElement('div');
        div.className = 'contact-item' + (agent.id === currentAgentId ? ' active' : '');
        div.innerHTML = `
          <div class="contact-avatar">${agent.avatar || '🤖'}</div>
          <div class="contact-info">
            <div class="contact-name">${agent.name}</div>
            <div class="contact-last-msg">${getLastMessagePreview(agent.id)}</div>
          </div>
        `;
        div.addEventListener('click', () => openChat(agent.id));
        contactItems.appendChild(div);
      });
      if (agents.length === 0) {
        contactItems.innerHTML = '<p style="text-align:center; color:var(--text-medium); margin-top:2rem;">点击 + 添加智能伙伴</p>';
      }
    }

    function getLastMessagePreview(agentId) {
      const msgs = getAgentMessages(agentId);
      return msgs.length ? msgs[msgs.length-1].content.substring(0, 20) : '开始聊天吧';
    }

    // 打开聊天
    function openChat(agentId) {
      currentAgentId = agentId;
      const agent = agents.find(a => a.id === agentId);
      if (!agent) return;
      chatTitle.textContent = agent.name;
      chatAvatar.textContent = agent.avatar || '🤖';
      renderChatMessages();
      chatWindow.classList.add('active-mobile');
      if (window.innerWidth < 768) {
        document.getElementById('contactList').classList.add('hidden-mobile');
      }
    }

    function closeChat() {
      currentAgentId = null;
      chatWindow.classList.remove('active-mobile');
      if (window.innerWidth < 768) {
        document.getElementById('contactList').classList.remove('hidden-mobile');
      }
    }

    // 渲染聊天消息
    function renderChatMessages() {
      if (!currentAgentId) return;
      chatMessages.innerHTML = '';
      const msgs = getAgentMessages(currentAgentId);
      msgs.forEach(msg => appendMessageBubble(msg.role, msg.content));
      scrollToBottom();
    }

    function appendMessageBubble(role, content) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = content;
      chatMessages.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 发送消息
    async function sendMessage() {
      if (!currentAgentId) return;
      const text = messageInput.value.trim();
      if (!text) return;
      if (!userApiKey) { alert('请先到设置填写 API Key (点击右下角齿轮)'); return; }

      const agent = agents.find(a => a.id === currentAgentId);
      if (!agent) return;

      // 添加用户消息
      if (!messages[currentAgentId]) messages[currentAgentId] = [];
      messages[currentAgentId].push({ role: 'user', content: text, time: Date.now() });
      saveMessages();
      appendMessageBubble('user', text);
      messageInput.value = '';

      // 准备请求
      const systemPrompt = agent.prompt || '你是一个有用的助手';
      const recent = getAgentMessages(currentAgentId).slice(-20);
      const apiMessages = [
        { role: 'system', content: systemPrompt },
        ...recent.map(m => ({ role: m.role, content: m.content }))
      ];

      try {
        const response = await fetch(DEEPSEEK_API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${userApiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: apiMessages,
            stream: true
          })
        });
        if (!response.ok) throw new Error(await response.text());
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let assistantMsg = { role: 'assistant', content: '', time: Date.now() };
        messages[currentAgentId].push(assistantMsg);
        const assistantDiv = document.createElement('div');
        assistantDiv.className = 'msg assistant';
        chatMessages.appendChild(assistantDiv);

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6).trim();
              if (data === '[DONE]') {
                saveMessages();
                return;
              }
              try {
                const parsed = JSON.parse(data);
                const chunk = parsed.choices?.[0]?.delta?.content;
                if (chunk) {
                  assistantMsg.content += chunk;
                  assistantDiv.textContent = assistantMsg.content;
                  scrollToBottom();
                }
              } catch(e) {}
            }
          }
        }
        saveMessages();
      } catch (err) {
        alert('发送失败: ' + err.message);
        messages[currentAgentId].pop();
        saveMessages();
        renderChatMessages();
      }
    }

    // 添加智能体
    function addAgent(name, prompt, avatar = '🤖') {
      const id = Date.now().toString(36) + Math.random().toString(36).substr(2);
      agents.push({ id, name, avatar, prompt, createdAt: Date.now() });
      saveAgents();
      renderContactList();
      return id;
    }

    // 从预设添加
    async function showPresets() {
      if (!PERSONAS) {
        try {
          const resp = await fetch('/prompt.json');
          PERSONAS = await resp.json();
        } catch(e) {
          alert('预设加载失败，请刷新或使用自定义创建');
          return;
        }
      }
      const container = document.getElementById('presetListContainer');
      container.innerHTML = '<p>选择预设角色：</p><div class="preset-list"></div>';
      const list = container.querySelector('.preset-list');
      Object.entries(PERSONAS).forEach(([key, val]) => {
        const div = document.createElement('div');
        div.className = 'preset-item';
        div.innerHTML = `<strong>${val.name}</strong><p style="font-size:0.8rem;margin-top:0.2rem;">${val.prompt.substring(0,40)}...</p>`;
        div.addEventListener('click', () => {
          addAgent(val.name, val.prompt, val.avatar || '🤖');
          document.getElementById('addModal').style.display = 'none';
          resetAddModal();
        });
        list.appendChild(div);
      });
      container.style.display = 'block';
    }

    function resetAddModal() {
      document.getElementById('addMenuOptions').style.display = 'block';
      document.getElementById('presetListContainer').style.display = 'none';
      document.getElementById('customForm').style.display = 'none';
    }

    // 事件绑定
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    backBtn.addEventListener('click', closeChat);

    // 添加按钮
    document.getElementById('showAddMenuBtn').addEventListener('click', () => {
      document.getElementById('addModal').style.display = 'flex';
    });
    document.getElementById('closeAddModalBtn').addEventListener('click', () => {
      document.getElementById('addModal').style.display = 'none';
      resetAddModal();
    });
    document.getElementById('fromPresetBtn').addEventListener('click', showPresets);
    document.getElementById('customBtn').addEventListener('click', () => {
      document.getElementById('addMenuOptions').style.display = 'none';
      document.getElementById('presetListContainer').style.display = 'none';
      document.getElementById('customForm').style.display = 'block';
    });
    document.getElementById('cancelCustomBtn').addEventListener('click', resetAddModal);
    document.getElementById('saveCustomBtn').addEventListener('click', () => {
      const name = document.getElementById('agentName').value.trim();
      const prompt = document.getElementById('agentPrompt').value.trim();
      if (!name || !prompt) return;
      addAgent(name, prompt);
      document.getElementById('addModal').style.display = 'none';
      resetAddModal();
    });

    // 右键菜单
    let contextMsgIndex = -1;
    function showContextMenu(e, index) {
      e.preventDefault();
      contextMsgIndex = index;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      contextMenu.innerHTML = `
        <div class="menu-item" data-action="copy">复制</div>
        <div class="menu-item" data-action="delete">删除（本地）</div>
        <div class="menu-item" data-action="quote">引用</div>
      `;
      contextMenu.style.display = 'block';
      contextMenu.style.left = Math.min(clientX, window.innerWidth - 150) + 'px';
      contextMenu.style.top = Math.min(clientY, window.innerHeight - 150) + 'px';
    }
    chatMessages.addEventListener('contextmenu', (e) => {
      const msgDiv = e.target.closest('.msg');
      if (!msgDiv || !currentAgentId) return;
      const all = [...chatMessages.querySelectorAll('.msg')];
      const idx = all.indexOf(msgDiv);
      if (idx === -1) return;
      showContextMenu(e, idx);
    });
    contextMenu.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (!action || !currentAgentId) return;
      const msgs = getAgentMessages(currentAgentId);
      if (action === 'copy') {
        navigator.clipboard.writeText(msgs[contextMsgIndex]?.content || '');
      } else if (action === 'delete') {
        msgs.splice(contextMsgIndex, 1);
        messages[currentAgentId] = msgs;
        saveMessages();
        renderChatMessages();
      } else if (action === 'quote') {
        const text = msgs[contextMsgIndex]?.content || '';
        messageInput.value = `「${text.substring(0,40)}」 `;
        messageInput.focus();
      }
      contextMenu.style.display = 'none';
    });
    document.addEventListener('click', () => contextMenu.style.display = 'none');
    let longPressTimer;
    chatMessages.addEventListener('touchstart', (e) => {
      const msgDiv = e.target.closest('.msg');
      if (!msgDiv) return;
      longPressTimer = setTimeout(() => {
        const all = [...chatMessages.querySelectorAll('.msg')];
        const idx = all.indexOf(msgDiv);
        if (idx === -1) return;
        showContextMenu(e, idx);
      }, 500);
    });
    chatMessages.addEventListener('touchend', () => clearTimeout(longPressTimer));
    chatMessages.addEventListener('touchmove', () => clearTimeout(longPressTimer));

    // 初始化
    loadAgents();
    loadMessages();
    renderContactList();

    // 桌面端默认不打开聊天，移动端打开也是空白
    // API Key 暂时用 prompt 输入框？不，我们添加一个简单的设置入口（可以继续用之前的设置图标，这里省略以保持简洁，后续可加）
    // 为了简洁，我们假设用户已经在 localStorage 中设置了 key（可手动编辑 localStorage 或通过之前的设置页面）。
    // 如果需要设置界面，可以后续补充。这里先保证核心聊天可用。
    if (!userApiKey) {
      // 简单提示，但避免骚扰
      console.warn('请设置 API Key: localStorage.setItem("luminya_apikey","sk-...")');
    }
  })();
</script>
