<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>LumiNya · 陪伴</title>
  <link rel="stylesheet" href="/css/chat.css" />
  <style>
    /* 居中遮罩弹窗样式（补充，不会与 chat.css 冲突） */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-dialog {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 90%;
      max-width: 380px;
      box-shadow: var(--shadow-lg);
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-dialog h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .modal-close {
      align-self: flex-end;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .preset-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition);
    }
    .preset-item:hover { background: var(--bg-hover); }
    .preset-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
    }
    .preset-info {
      flex: 1;
      overflow: hidden;
    }
    .preset-name { font-weight: 600; }
    .preset-desc { font-size: 0.8rem; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      font-size: 0.9rem;
      color: var(--text-primary);
      outline: none;
    }
    .form-group textarea { height: 80px; resize: vertical; }
    .btn-group { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 0.5rem; }
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition);
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="userAvatarBtn">😊</div>
        <div class="user-info">
          <div class="user-name">LumiNya</div>
          <div class="user-status">在线</div>
        </div>
        <button class="settings-btn" id="settingsBtn">⚙️</button>
      </div>

      <div class="agent-list" id="agentList">
        <div class="empty-hint" id="emptyHint">✨ 还没有伙伴<br><strong>点击下方 + 添加第一个</strong></div>
      </div>

      <div class="sidebar-footer">
        <button class="add-agent-btn" id="addAgentBtn"><span>+</span> 新伙伴</button>
      </div>
    </aside>

    <!-- 聊天主区域 -->
    <section class="chat-area" id="chatArea">
      <header class="chat-header">
        <button class="back-btn" id="backBtn">←</button>
        <div class="chat-title" id="chatTitle">选择一个伙伴开始聊天</div>
      </header>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="说点什么..." autocomplete="off" disabled>
        <button class="send-btn" id="sendBtn" disabled>➤</button>
      </div>
    </section>
  </div>

  <!-- 设置弹窗 -->
  <div class="settings-overlay" id="settingsOverlay" style="display:none;">
    <div class="settings-dialog">
      <h2>设置</h2>
      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="nicknameInput" placeholder="你的名字">
      </div>
      <div class="form-group">
        <label>DeepSeek API Key</label>
        <input type="password" id="apiKeyInput" placeholder="sk-...">
      </div>
      <div id="keyStatus" style="font-size:0.8rem; margin-top:0.2rem;"></div>
      <button class="btn primary" id="testKeyBtn">测试 Key</button>
      <div style="display:flex; gap:0.8rem; margin-top:0.5rem;">
        <button class="btn secondary" id="exportBtn">导出数据</button>
        <button class="btn secondary" id="clearBtn">清除所有数据</button>
      </div>
      <button class="btn secondary" id="closeSettingsBtn">关闭</button>
    </div>
  </div>

  <!-- 添加智能体弹窗 -->
  <div class="modal-overlay" id="addModalOverlay" style="display:none;">
    <div class="modal-dialog" id="addModalContent">
      <!-- 内容动态填充 -->
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="contextMenu"></div>

  <script>
    (function() {
      const DEEPSEEK_API = 'https://api.deepseek.com/v1/chat/completions';
      let agents = [];
      let messages = {};
      let currentAgentId = null;
      let userApiKey = localStorage.getItem('luminya_apikey') || '';
      let userNickname = localStorage.getItem('luminya_nickname') || 'LumiNya';

      // DOM
      const sidebar = document.getElementById('sidebar');
      const agentList = document.getElementById('agentList');
      const addAgentBtn = document.getElementById('addAgentBtn');
      const addModalOverlay = document.getElementById('addModalOverlay');
      const addModalContent = document.getElementById('addModalContent');
      const chatArea = document.getElementById('chatArea');
      const chatTitle = document.getElementById('chatTitle');
      const chatMessages = document.getElementById('chatMessages');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const backBtn = document.getElementById('backBtn');
      const settingsBtn = document.getElementById('settingsBtn');
      const userAvatarBtn = document.getElementById('userAvatarBtn');
      const settingsOverlay = document.getElementById('settingsOverlay');
      const contextMenu = document.getElementById('contextMenu');

      // 持久化
      function loadAgents() { agents = JSON.parse(localStorage.getItem('luminya_agents') || '[]'); }
      function saveAgents() { localStorage.setItem('luminya_agents', JSON.stringify(agents)); }
      function loadMessages() { messages = JSON.parse(localStorage.getItem('luminya_messages') || '{}'); }
      function saveMessages() { localStorage.setItem('luminya_messages', JSON.stringify(messages)); }
      function getAgentMessages(id) { return messages[id] || []; }
      function updateAgentPreview(id, text) {
        const agent = agents.find(a => a.id === id);
        if (agent) { agent.lastMsg = text?.slice(0, 30) || ''; agent.lastTime = Date.now(); saveAgents(); }
      }

      // 渲染侧边栏列表
      function renderAgentList() {
        agentList.innerHTML = '';
        if (!agents.length) {
          agentList.innerHTML = '<div class="empty-hint">✨ 还没有伙伴<br><strong>点击下方 + 添加第一个</strong></div>';
          return;
        }
        agents.sort((a,b) => (b.lastTime||0)-(a.lastTime||0)).forEach(agent => {
          const el = document.createElement('div');
          el.className = 'agent-item' + (agent.id === currentAgentId ? ' active' : '');
          el.innerHTML = `<div class="agent-avatar">${agent.avatar||'🤖'}</div>
                          <div class="agent-info"><div class="agent-name">${agent.name}</div><div class="agent-preview">${agent.lastMsg||'开始聊天吧'}</div></div>`;
          el.addEventListener('click', () => switchChat(agent.id));
          agentList.appendChild(el);
        });
      }

      // 切换聊天
      function switchChat(id) {
        currentAgentId = id;
        const agent = agents.find(a => a.id === id);
        if (!agent) return;
        chatTitle.textContent = agent.name;
        messageInput.disabled = false;
        sendBtn.disabled = false;
        renderChatMessages();
        if (window.innerWidth < 768) {
          sidebar.classList.add('hidden-mobile');
          chatArea.classList.add('active-mobile');
        }
        renderAgentList();
      }

      function closeChat() {
        currentAgentId = null;
        chatTitle.textContent = '选择一个伙伴开始聊天';
        messageInput.disabled = true;
        sendBtn.disabled = true;
        chatMessages.innerHTML = '';
        if (window.innerWidth < 768) {
          sidebar.classList.remove('hidden-mobile');
          chatArea.classList.remove('active-mobile');
        }
        renderAgentList();
      }

      function renderChatMessages() {
        chatMessages.innerHTML = '';
        if (!currentAgentId) return;
        getAgentMessages(currentAgentId).forEach(m => appendMsgBubble(m.role, m.content));
        scrollToBottom();
      }

      function appendMsgBubble(role, content) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = content;
        chatMessages.appendChild(div);
        scrollToBottom();
      }

      function scrollToBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }

      // 添加智能体弹窗
      function openAddModal() { addModalOverlay.style.display = 'flex'; showMainAddPanel(); }
      function closeAddModal() { addModalOverlay.style.display = 'none'; }

      function showMainAddPanel() {
        addModalContent.innerHTML = `
          <button class="modal-close" id="closeModalBtn">✕</button>
          <h3>添加新伙伴</h3>
          <button class="btn btn-secondary" id="presetBtn">🎭 从预设添加</button>
          <button class="btn btn-secondary" id="customBtn">✏️ 自定义创建</button>
        `;
        document.getElementById('closeModalBtn').addEventListener('click', closeAddModal);
        document.getElementById('presetBtn').addEventListener('click', showPresetPanel);
        document.getElementById('customBtn').addEventListener('click', showCustomPanel);
      }

      async function showPresetPanel() {
        addModalContent.innerHTML = '<button class="modal-close" id="closePresetBtn">✕</button><h3>选择预设</h3><div class="preset-list" id="presetList">加载中...</div>';
        document.getElementById('closePresetBtn').addEventListener('click', closeAddModal);
        try {
          const resp = await fetch('/chat_files/prompt.json');
          if (!resp.ok) throw new Error();
          const presets = await resp.json();
          const list = document.getElementById('presetList');
          list.innerHTML = '';
          Object.entries(presets).forEach(([key, preset]) => {
            const item = document.createElement('div');
            item.className = 'preset-item';
            item.innerHTML = `<div class="preset-avatar">${preset.avatar||'🤖'}</div>
                              <div class="preset-info"><div class="preset-name">${preset.name}</div><div class="preset-desc">${preset.prompt.slice(0,40)}...</div></div>`;
            item.addEventListener('click', () => {
              addAgent(preset.name, preset.prompt, preset.avatar||'🤖');
              closeAddModal();
            });
            list.appendChild(item);
          });
        } catch {
          addModalContent.innerHTML = '<p style="color:var(--text-secondary); text-align:center; padding:2rem;">预设加载失败，请刷新或自定义创建</p>';
        }
      }

      function showCustomPanel() {
        addModalContent.innerHTML = `
          <button class="modal-close" id="closeCustomBtn">✕</button>
          <h3>自定义伙伴</h3>
          <div class="form-group"><input type="text" id="customName" placeholder="伙伴名称"></div>
          <div class="form-group"><textarea id="customPrompt" placeholder="角色设定 (System Prompt)"></textarea></div>
          <div class="btn-group">
            <button class="btn btn-secondary" id="cancelCustomBtn">取消</button>
            <button class="btn btn-primary" id="saveCustomBtn">创建</button>
          </div>
        `;
        document.getElementById('closeCustomBtn').addEventListener('click', closeAddModal);
        document.getElementById('cancelCustomBtn').addEventListener('click', closeAddModal);
        document.getElementById('saveCustomBtn').addEventListener('click', () => {
          const name = document.getElementById('customName').value.trim();
          const prompt = document.getElementById('customPrompt').value.trim();
          if (!name || !prompt) return;
          addAgent(name, prompt);
          closeAddModal();
        });
      }

      function addAgent(name, prompt, avatar='🤖') {
        const id = Date.now().toString(36)+Math.random().toString(36).substr(2);
        agents.push({ id, name, avatar, prompt, lastMsg:'', lastTime:Date.now(), createdAt:Date.now() });
        saveAgents();
        renderAgentList();
        return id;
      }

      // 消息发送
      async function sendMessage() {
        if (!currentAgentId || !userApiKey) { if(!userApiKey) alert('请先设置 API Key'); return; }
        const text = messageInput.value.trim();
        if (!text) return;
        const agent = agents.find(a=>a.id===currentAgentId);
        if (!agent) return;
        if (!messages[currentAgentId]) messages[currentAgentId] = [];
        messages[currentAgentId].push({ role:'user', content:text, time:Date.now() });
        saveMessages(); updateAgentPreview(currentAgentId, text);
        appendMsgBubble('user', text);
        messageInput.value = '';
        const systemPrompt = agent.prompt;
        const recent = getAgentMessages(currentAgentId).slice(-20);
        const apiMsgs = [ { role:'system', content:systemPrompt }, ...recent.map(m=>({role:m.role, content:m.content})) ];
        try {
          const res = await fetch(DEEPSEEK_API, {
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${userApiKey}` },
            body: JSON.stringify({ model:'deepseek-chat', messages:apiMsgs, stream:true })
          });
          if (!res.ok) throw new Error(await res.text());
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          const assistantMsg = { role:'assistant', content:'', time:Date.now() };
          messages[currentAgentId].push(assistantMsg);
          const bubble = document.createElement('div'); bubble.className = 'msg assistant';
          chatMessages.appendChild(bubble);
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream:true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const data = line.slice(6).trim();
                if (data === '[DONE]') { saveMessages(); updateAgentPreview(currentAgentId, assistantMsg.content); return; }
                try {
                  const json = JSON.parse(data);
                  const chunk = json.choices?.[0]?.delta?.content;
                  if (chunk) { assistantMsg.content += chunk; bubble.textContent = assistantMsg.content; scrollToBottom(); }
                } catch(e) {}
              }
            }
          }
          saveMessages(); updateAgentPreview(currentAgentId, assistantMsg.content);
        } catch(err) {
          alert('发送失败: '+err.message);
          messages[currentAgentId].pop(); saveMessages(); renderChatMessages(); updateAgentPreview(currentAgentId, text);
        }
      }

      // 设置面板
      function openSettings() {
        document.getElementById('nicknameInput').value = userNickname;
        document.getElementById('apiKeyInput').value = userApiKey;
        document.getElementById('keyStatus').textContent = '';
        settingsOverlay.style.display = 'flex';
      }
      function closeSettings() {
        settingsOverlay.style.display = 'none';
        userNickname = document.getElementById('nicknameInput').value.trim() || 'LumiNya';
        localStorage.setItem('luminya_nickname', userNickname);
        document.querySelector('.user-name').textContent = userNickname;
        const newKey = document.getElementById('apiKeyInput').value.trim();
        if (newKey !== userApiKey) { userApiKey = newKey; localStorage.setItem('luminya_apikey', userApiKey); }
      }
      async function testApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        const status = document.getElementById('keyStatus');
        if (!key) { status.textContent = '请输入 Key'; return; }
        status.textContent = '测试中...';
        try {
          const r = await fetch('https://api.deepseek.com/models', { headers:{ 'Authorization':`Bearer ${key}` } });
          status.textContent = r.ok ? '✓ 有效' : '✗ 无效';
          status.style.color = r.ok ? '#4caf50' : '#e0556a';
        } catch(e) { status.textContent = '✗ 网络错误'; status.style.color = '#e0556a'; }
      }

      // 右键菜单
      let ctxIndex = -1;
      function showCtx(e, idx) {
        e.preventDefault();
        ctxIndex = idx;
        contextMenu.innerHTML = '<div class="menu-item" data-act="copy">复制</div><div class="menu-item" data-act="delete">删除</div><div class="menu-item" data-act="quote">引用</div>';
        contextMenu.style.display = 'block';
        contextMenu.style.left = Math.min(e.clientX, innerWidth-150)+'px';
        contextMenu.style.top = Math.min(e.clientY, innerHeight-120)+'px';
      }
      chatMessages.addEventListener('contextmenu', e => {
        const msg = e.target.closest('.msg'); if(!msg||!currentAgentId) return;
        const idx = [...chatMessages.children].indexOf(msg); if(idx>-1) showCtx(e, idx);
      });
      contextMenu.addEventListener('click', e => {
        const act = e.target.dataset.act; if(!act||!currentAgentId) return;
        const msgs = getAgentMessages(currentAgentId);
        if (act==='copy') navigator.clipboard.writeText(msgs[ctxIndex]?.content||'');
        else if (act==='delete') { msgs.splice(ctxIndex,1); messages[currentAgentId]=msgs; saveMessages(); renderChatMessages(); updateAgentPreview(currentAgentId, msgs[msgs.length-1]?.content||''); }
        else if (act==='quote') { const t=msgs[ctxIndex]?.content||''; messageInput.value='「'+t.slice(0,40)+'」 '; messageInput.focus(); }
        contextMenu.style.display='none';
      });
      document.addEventListener('click', ()=>contextMenu.style.display='none');
      let timer;
      chatMessages.addEventListener('touchstart', e => {
        const msg = e.target.closest('.msg'); if(!msg) return;
        timer = setTimeout(()=>{ const idx=[...chatMessages.children].indexOf(msg); if(idx>-1) showCtx({clientX:e.touches[0].clientX, clientY:e.touches[0].clientY, preventDefault:()=>{}},idx); },500);
      });
      chatMessages.addEventListener('touchend', ()=>clearTimeout(timer));
      chatMessages.addEventListener('touchmove', ()=>clearTimeout(timer));

      // 事件绑定
      addAgentBtn.addEventListener('click', openAddModal);
      addModalOverlay.addEventListener('click', e => { if (e.target === addModalOverlay) closeAddModal(); });
      sendBtn.addEventListener('click', sendMessage);
      messageInput.addEventListener('keypress', e => { if (e.key==='Enter') sendMessage(); });
      backBtn.addEventListener('click', closeChat);
      settingsBtn.addEventListener('click', openSettings);
      userAvatarBtn.addEventListener('click', openSettings);
      document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
      document.getElementById('testKeyBtn').addEventListener('click', testApiKey);
      document.getElementById('clearBtn').addEventListener('click', ()=>{
        if(confirm('确定清除所有数据？')){ localStorage.clear(); agents=[]; messages={}; currentAgentId=null; renderAgentList(); closeChat(); closeSettings(); }
      });
      document.getElementById('exportBtn').addEventListener('click', ()=>{
        const blob=new Blob([JSON.stringify({agents,messages,version:1},null,2)],{type:'application/json'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='luminya_backup.json'; a.click();
      });
      settingsOverlay.addEventListener('click', e => { if(e.target===settingsOverlay) closeSettings(); });

      // 初始化
      loadAgents(); loadMessages(); renderAgentList();
      document.querySelector('.user-name').textContent = userNickname;
    })();
  </script>
</body>
</html>
