<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>LumiNya · 陪伴</title>
  <style>
    /* ===== 全局重置 & 主题变量 ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#faf9f7; color:#2e2e2e; }
    :root {
      --bg-base: #faf9f7;
      --bg-surface: #ffffff;
      --bg-sidebar: #f5f4f2;
      --bg-hover: rgba(0,0,0,0.04);
      --bg-input: #f2f1ef;
      --text-primary: #2e2e2e;
      --text-secondary: #6b6b6b;
      --text-tertiary: #9e9e9e;
      --accent: #e07b6e;
      --accent-soft: rgba(224,123,110,0.1);
      --accent-hover: #d16a5d;
      --border-subtle: rgba(0,0,0,0.06);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 28px rgba(0,0,0,0.08);
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-full: 28px;
      --transition: 0.25s ease;
    }
    [data-theme="dark"] {
      --bg-base: #1e1e1e;
      --bg-surface: #2a2a2a;
      --bg-sidebar: #262626;
      --bg-hover: rgba(255,255,255,0.05);
      --bg-input: #323232;
      --text-primary: #eaeaea;
      --text-secondary: #aaa;
      --text-tertiary: #777;
      --accent: #e68a7a;
      --accent-hover: #d97968;
      --border-subtle: rgba(255,255,255,0.06);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 28px rgba(0,0,0,0.5);
    }

    /* ===== 主容器 ===== */
    #app {
      display: flex;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-surface);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    @media (max-width: 768px) {
      #app { max-width:100%; box-shadow:none; border-radius:0; }
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-subtle);
      z-index: 10;
      transition: transform var(--transition);
    }
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        min-width: 100%;
        transform: translateX(0);
        z-index: 10;
      }
      .sidebar.hidden-mobile {
        transform: translateX(-100%);
      }
    }

    .sidebar-header {
      padding: 1.2rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .sidebar-header .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform var(--transition);
      flex-shrink: 0;
    }
    .sidebar-header .avatar:hover { transform: scale(1.05); }
    .sidebar-header .user-info {
      flex: 1;
      overflow: hidden;
    }
    .sidebar-header .user-name {
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sidebar-header .user-status {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin-top: 0.1rem;
    }
    .sidebar-header .settings-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.3rem;
      border-radius: 50%;
      transition: background var(--transition);
    }
    .sidebar-header .settings-btn:hover { background: var(--bg-hover); }

    .agent-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .agent-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem;
      margin-bottom: 0.2rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background var(--transition);
    }
    .agent-item:hover,
    .agent-item.active { background: var(--bg-hover); }
    .agent-item .agent-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .agent-item .agent-info {
      flex: 1;
      overflow: hidden;
    }
    .agent-item .agent-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agent-item .agent-preview {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      margin-top: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-hint {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-tertiary);
      font-size: 0.9rem;
    }
    .empty-hint strong { color: var(--accent); }

    .sidebar-footer {
      padding: 0.8rem;
      border-top: 1px solid var(--border-subtle);
    }
    .add-agent-btn {
      width: 100%;
      padding: 0.7rem;
      border-radius: var(--radius-full);
      border: 1.5px dashed var(--text-tertiary);
      background: transparent;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all var(--transition);
    }
    .add-agent-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ===== 聊天区域 ===== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      min-width: 0;
      z-index: 5;
    }
    @media (max-width: 768px) {
      .chat-area {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 20;
        display: none; /* 默认隐藏，避免遮挡侧边栏点击 */
      }
      .chat-area.active-mobile {
        display: flex; /* 激活时显示 */
      }
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1.2rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }
    .chat-header .back-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.2rem;
    }
    @media (max-width: 768px) {
      .chat-header .back-btn { display: block; }
    }
    .chat-header .chat-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      line-height: 1.55;
      font-size: 0.95rem;
      word-break: break-word;
      position: relative;
      animation: fadeIn 0.2s ease;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 6px rgba(224,123,110,0.3);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bg-surface);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.2rem;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
    }
    .input-area input {
      flex: 1;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 0.65rem 1.2rem;
      background: var(--bg-input);
      font-size: 0.95rem;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition);
    }
    .input-area input:focus { border-color: var(--accent); }
    .input-area input:disabled { opacity:0.5; }
    .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition);
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity:0.5; cursor:not-allowed; }

    /* ===== 弹窗 ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-dialog {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 90%;
      max-width: 380px;
      box-shadow: var(--shadow-lg);
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-dialog h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .modal-close {
      align-self: flex-end;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.2rem 0.5rem;
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .preset-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background var(--transition);
    }
    .preset-item:hover { background: var(--bg-hover); }
    .preset-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .preset-info {
      flex: 1;
      overflow: hidden;
    }
    .preset-name { font-weight: 600; }
    .preset-desc {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-input);
      font-size: 0.9rem;
      color: var(--text-primary);
      outline: none;
    }
    .form-group textarea { height: 80px; resize: vertical; }
    .btn-group {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition);
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-subtle); }
    .btn-secondary:hover { background: var(--bg-hover); }

    /* ===== 设置面板 ===== */
    .settings-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .settings-dialog {
      width: 90%;
      max-width: 420px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .settings-dialog h2 {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .settings-dialog .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
    }
    .settings-dialog .form-group input {
      width: 100%;
      padding: 0.65rem;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-input);
      color: var(--text-primary);
    }
    .settings-dialog .btn {
      padding: 0.7rem;
      border-radius: var(--radius-full);
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background var(--transition);
    }
    .settings-dialog .btn.primary { background: var(--accent); color: #fff; }
    .settings-dialog .btn.primary:hover { background: var(--accent-hover); }
    .settings-dialog .btn.secondary { background: transparent; color: var(--text-secondary); }

    /* ===== 右键菜单 ===== */
    .context-menu {
      position: fixed;
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 0.3rem 0;
      z-index: 300;
      display: none;
      min-width: 130px;
    }
    .context-menu .menu-item {
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-primary);
      transition: background var(--transition);
    }
    .context-menu .menu-item:hover { background: var(--bg-hover); }

    /* ===== 滚动条 ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    [data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }

    @keyframes fadeIn {
      from { opacity:0; transform:translateY(6px); }
      to { opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="userAvatarBtn">😊</div>
        <div class="user-info">
          <div class="user-name" id="userNameDisplay">LumiNya</div>
          <div class="user-status">在线</div>
        </div>
        <button class="settings-btn" id="settingsBtn">⚙️</button>
      </div>
      <div class="agent-list" id="agentList"></div>
      <div class="sidebar-footer">
        <button class="add-agent-btn" id="addAgentBtn"><span>+</span> 新伙伴</button>
      </div>
    </aside>

    <!-- 聊天区域 -->
    <section class="chat-area" id="chatArea">
      <header class="chat-header">
        <button class="back-btn" id="backBtn">←</button>
        <div class="chat-title" id="chatTitle">选择一个伙伴开始聊天</div>
      </header>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="说点什么..." autocomplete="off" disabled>
        <button class="send-btn" id="sendBtn" disabled>➤</button>
      </div>
    </section>
  </div>

  <!-- 设置弹窗 -->
  <div class="settings-overlay" id="settingsOverlay" style="display:none;">
    <div class="settings-dialog">
      <h2>设置</h2>
      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="nicknameInput" placeholder="你的名字">
      </div>
      <div class="form-group">
        <label>DeepSeek API Key</label>
        <input type="password" id="apiKeyInput" placeholder="sk-...">
      </div>
      <div id="keyStatus" style="font-size:0.8rem; margin-top:0.2rem;"></div>
      <button class="btn primary" id="testKeyBtn">测试 Key</button>
      <div style="display:flex; gap:0.8rem; margin-top:0.5rem; flex-wrap:wrap;">
        <button class="btn secondary" id="exportBtn">导出数据</button>
        <button class="btn secondary" id="clearBtn">清除所有数据</button>
      </div>
      <button class="btn secondary" id="closeSettingsBtn">关闭</button>
    </div>
  </div>

  <!-- 添加智能体弹窗 -->
  <div class="modal-overlay" id="addModalOverlay" style="display:none;">
    <div class="modal-dialog" id="addModalContent"></div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="contextMenu"></div>

  <script>
    (function(){
      const DEEPSEEK_API = 'https://api.deepseek.com/v1/chat/completions';
      let agents = [];
      let messages = {};
      let currentAgentId = null;
      let userApiKey = localStorage.getItem('luminya_apikey') || '';
      let userNickname = localStorage.getItem('luminya_nickname') || 'LumiNya';

      // DOM 引用
      const sidebar = document.getElementById('sidebar');
      const agentList = document.getElementById('agentList');
      const addAgentBtn = document.getElementById('addAgentBtn');
      const addModalOverlay = document.getElementById('addModalOverlay');
      const addModalContent = document.getElementById('addModalContent');
      const chatArea = document.getElementById('chatArea');
      const chatTitle = document.getElementById('chatTitle');
      const chatMessages = document.getElementById('chatMessages');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const backBtn = document.getElementById('backBtn');
      const settingsBtn = document.getElementById('settingsBtn');
      const userAvatarBtn = document.getElementById('userAvatarBtn');
      const settingsOverlay = document.getElementById('settingsOverlay');
      const contextMenu = document.getElementById('contextMenu');
      const userNameDisplay = document.getElementById('userNameDisplay');

      // ----- 安全解析 -----
      function safeParseJSON(raw, fallback) {
        try { return JSON.parse(raw); } catch(_) { return fallback; }
      }

      // ----- 持久化（含备份）-----
      function loadAgents() {
        agents = safeParseJSON(localStorage.getItem('luminya_agents'), []);
      }
      function saveAgents() {
        localStorage.setItem('luminya_agents', JSON.stringify(agents));
      }

      function loadMessages() {
        // 先尝试主数据
        let data = safeParseJSON(localStorage.getItem('luminya_messages'), null);
        if (data !== null) {
          messages = data;
          return;
        }
        // 主数据为空或损坏，尝试备份
        const backup = safeParseJSON(localStorage.getItem('luminya_messages_backup'), null);
        if (backup !== null) {
          messages = backup;
          // 恢复主数据
          localStorage.setItem('luminya_messages', JSON.stringify(messages));
          console.warn('已从备份恢复消息数据');
          return;
        }
        // 完全无数据
        messages = {};
      }

      function saveMessages() {
        try {
          const json = JSON.stringify(messages);
          localStorage.setItem('luminya_messages', json);
          // 同时备份
          localStorage.setItem('luminya_messages_backup', json);
        } catch (e) {
          console.error('保存消息失败:', e);
        }
      }

      function getAgentMessages(id) {
        return messages[id] || [];
      }

      function updateAgentPreview(id, text) {
        const agent = agents.find(a => a.id === id);
        if (agent) {
          agent.lastMsg = text?.slice(0,30) || '';
          agent.lastTime = Date.now();
          saveAgents();
        }
      }

      // ----- 渲染侧边栏 -----
      function renderAgentList() {
        agentList.innerHTML = '';
        if (!agents.length) {
          agentList.innerHTML = '<div class="empty-hint">✨ 还没有伙伴<br><strong>点击下方 + 添加第一个</strong></div>';
          return;
        }
        agents.sort((a,b) => (b.lastTime||0) - (a.lastTime||0)).forEach(agent => {
          const el = document.createElement('div');
          el.className = 'agent-item' + (agent.id === currentAgentId ? ' active' : '');
          el.innerHTML = `<div class="agent-avatar">${agent.avatar||'🤖'}</div>
                          <div class="agent-info"><div class="agent-name">${agent.name}</div><div class="agent-preview">${agent.lastMsg||'开始聊天吧'}</div></div>`;
          el.addEventListener('click', () => switchChat(agent.id));
          agentList.appendChild(el);
        });
      }

      // ----- 切换聊天 -----
      function switchChat(id) {
        currentAgentId = id;
        const agent = agents.find(a => a.id === id);
        if (!agent) return;
        chatTitle.textContent = agent.name;
        messageInput.disabled = false;
        sendBtn.disabled = false;
        renderChatMessages();
        if (window.innerWidth <= 768) {
          sidebar.classList.add('hidden-mobile');
          chatArea.classList.add('active-mobile');
        }
        renderAgentList();
      }

      function closeChat() {
        currentAgentId = null;
        chatTitle.textContent = '选择一个伙伴开始聊天';
        messageInput.disabled = true;
        sendBtn.disabled = true;
        chatMessages.innerHTML = '';
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('hidden-mobile');
          chatArea.classList.remove('active-mobile');
        }
        renderAgentList();
      }

      function renderChatMessages() {
        chatMessages.innerHTML = '';
        if (!currentAgentId) return;
        const msgs = getAgentMessages(currentAgentId);
        msgs.forEach((m, idx) => {
          const div = document.createElement('div');
          div.className = `msg ${m.role}`;
          div.textContent = m.content;
          div.dataset.index = idx;
          chatMessages.appendChild(div);
        });
        scrollToBottom();
      }

      function appendMsgBubble(role, content) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = content;
        chatMessages.appendChild(div);
        scrollToBottom();
      }

      function scrollToBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }

      // ----- 添加智能体弹窗 -----
      function openAddModal() { addModalOverlay.style.display = 'flex'; showMainAddPanel(); }
      function closeAddModal() { addModalOverlay.style.display = 'none'; }

      function showMainAddPanel() {
        addModalContent.innerHTML = `
          <button class="modal-close" id="closeModalBtn">✕</button>
          <h3>添加新伙伴</h3>
          <button class="btn btn-secondary" id="presetBtn">🎭 从预设添加</button>
          <button class="btn btn-secondary" id="customBtn">✏️ 自定义创建</button>
        `;
        document.getElementById('closeModalBtn').addEventListener('click', closeAddModal);
        document.getElementById('presetBtn').addEventListener('click', showPresetPanel);
        document.getElementById('customBtn').addEventListener('click', showCustomPanel);
      }

      async function showPresetPanel() {
        addModalContent.innerHTML = '<button class="modal-close" id="closePresetBtn">✕</button><h3>选择预设</h3><div class="preset-list" id="presetList">加载中...</div>';
        document.getElementById('closePresetBtn').addEventListener('click', closeAddModal);
        try {
          const resp = await fetch('./chat_files/prompt.json');
          if (!resp.ok) throw new Error('网络请求失败');
          const presets = await resp.json();
          const list = document.getElementById('presetList');
          list.innerHTML = '';
          Object.entries(presets).forEach(([key, preset]) => {
            const item = document.createElement('div');
            item.className = 'preset-item';
            item.innerHTML = `<div class="preset-avatar">${preset.avatar||'🤖'}</div>
                              <div class="preset-info"><div class="preset-name">${preset.name}</div><div class="preset-desc">${preset.prompt.slice(0,40)}...</div></div>`;
            item.addEventListener('click', () => {
              addAgent(preset.name, preset.prompt, preset.avatar||'🤖');
              closeAddModal();
            });
            list.appendChild(item);
          });
        } catch(e) {
          addModalContent.innerHTML = `
            <button class="modal-close" id="closePresetErrBtn">✕</button>
            <h3>加载失败</h3>
            <p style="color:var(--text-secondary); text-align:center; padding:0.5rem;">预设加载失败，请检查网络或稍后重试</p>
            <button class="btn btn-secondary" id="retryPresetBtn">🔄 重试</button>
            <button class="btn btn-secondary" id="backMainBtn">← 返回</button>
          `;
          document.getElementById('closePresetErrBtn').addEventListener('click', closeAddModal);
          document.getElementById('retryPresetBtn').addEventListener('click', showPresetPanel);
          document.getElementById('backMainBtn').addEventListener('click', showMainAddPanel);
        }
      }

      function showCustomPanel() {
        addModalContent.innerHTML = `
          <button class="modal-close" id="closeCustomBtn">✕</button>
          <h3>自定义伙伴</h3>
          <div class="form-group"><input type="text" id="customName" placeholder="伙伴名称"></div>
          <div class="form-group"><textarea id="customPrompt" placeholder="角色设定 (System Prompt)"></textarea></div>
          <div class="btn-group">
            <button class="btn btn-secondary" id="cancelCustomBtn">取消</button>
            <button class="btn btn-primary" id="saveCustomBtn">创建</button>
          </div>
        `;
        document.getElementById('closeCustomBtn').addEventListener('click', closeAddModal);
        document.getElementById('cancelCustomBtn').addEventListener('click', closeAddModal);
        document.getElementById('saveCustomBtn').addEventListener('click', () => {
          const name = document.getElementById('customName').value.trim();
          const prompt = document.getElementById('customPrompt').value.trim();
          if (!name || !prompt) { alert('请完整填写名称和角色设定'); return; }
          addAgent(name, prompt);
          closeAddModal();
        });
      }

      function addAgent(name, prompt, avatar='🤖') {
        const id = Date.now().toString(36) + Math.random().toString(36).substring(2);
        agents.push({ id, name, avatar, prompt, lastMsg:'', lastTime:Date.now(), createdAt:Date.now() });
        saveAgents();
        renderAgentList();
        switchChat(id);
        return id;
      }

      // ----- 发送消息（流式+保存修复）-----
      async function sendMessage() {
        if (!currentAgentId) return;
        if (!userApiKey) {
          alert('请先设置 API Key（点击头像或⚙️进入设置）');
          return;
        }
        const text = messageInput.value.trim();
        if (!text) return;
        const agent = agents.find(a => a.id === currentAgentId);
        if (!agent) return;

        if (!messages[currentAgentId]) messages[currentAgentId] = [];
        messages[currentAgentId].push({ role:'user', content:text, time:Date.now() });
        saveMessages();
        updateAgentPreview(currentAgentId, text);
        appendMsgBubble('user', text);
        messageInput.value = '';

        const systemPrompt = agent.prompt || '';
        const recent = getAgentMessages(currentAgentId).slice(-20);
        const apiMsgs = [
          { role:'system', content:systemPrompt },
          ...recent.map(m => ({ role:m.role, content:m.content }))
        ];

        const assistantMsg = { role:'assistant', content:'', time:Date.now() };
        messages[currentAgentId].push(assistantMsg);
        const bubble = document.createElement('div');
        bubble.className = 'msg assistant';
        chatMessages.appendChild(bubble);

        try {
          const res = await fetch(DEEPSEEK_API, {
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${userApiKey}` },
            body: JSON.stringify({ model:'deepseek-chat', messages:apiMsgs, stream:true })
          });
          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`API 错误 (${res.status}): ${errText}`);
          }
          if (!res.body) throw new Error('响应体为空');

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream:true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const data = line.slice(6).trim();
                if (data === '[DONE]') continue;
                try {
                  const json = JSON.parse(data);
                  const chunk = json.choices?.[0]?.delta?.content;
                  if (chunk) {
                    assistantMsg.content += chunk;
                    bubble.textContent = assistantMsg.content;
                    scrollToBottom();
                  }
                } catch(_) {}
              }
            }
          }
          if (!assistantMsg.content) {
            messages[currentAgentId].pop();
            bubble.remove();
          } else {
            saveMessages();
            updateAgentPreview(currentAgentId, assistantMsg.content);
          }
        } catch(err) {
          messages[currentAgentId].pop();
          bubble.remove();
          alert('发送失败: ' + err.message);
        } finally {
          renderChatMessages();
          const msgs = getAgentMessages(currentAgentId);
          const last = msgs[msgs.length-1];
          updateAgentPreview(currentAgentId, last?.role === 'assistant' ? last.content : '');
          // 确保保存（防止意外丢失）
          saveMessages();
        }
      }

      // ----- 设置面板 -----
      function openSettings() {
        document.getElementById('nicknameInput').value = userNickname;
        document.getElementById('apiKeyInput').value = userApiKey;
        document.getElementById('keyStatus').textContent = '';
        settingsOverlay.style.display = 'flex';
      }
      function closeSettings() {
        settingsOverlay.style.display = 'none';
        const newNick = document.getElementById('nicknameInput').value.trim() || 'LumiNya';
        if (newNick !== userNickname) {
          userNickname = newNick;
          localStorage.setItem('luminya_nickname', userNickname);
          userNameDisplay.textContent = userNickname;
        }
        const newKey = document.getElementById('apiKeyInput').value.trim();
        if (newKey !== userApiKey) {
          userApiKey = newKey;
          localStorage.setItem('luminya_apikey', userApiKey);
        }
      }

      async function testApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        const status = document.getElementById('keyStatus');
        if (!key) { status.textContent = '请输入 Key'; status.style.color = ''; return; }
        status.textContent = '测试中...';
        status.style.color = '';
        try {
          const r = await fetch('https://api.deepseek.com/models', {
            headers: { 'Authorization': `Bearer ${key}` }
          });
          if (r.ok) {
            status.textContent = '✓ 有效';
            status.style.color = '#4caf50';
          } else {
            status.textContent = '✗ 无效 (状态 ' + r.status + ')';
            status.style.color = '#e0556a';
          }
        } catch(e) {
          status.textContent = '✗ 网络错误: ' + e.message;
          status.style.color = '#e0556a';
        }
      }

      // ----- 清除所有数据 -----
      function clearAllData() {
        if (!confirm('确定清除所有数据？此操作不可恢复！')) return;
        localStorage.clear();
        agents = [];
        messages = {};
        currentAgentId = null;
        userApiKey = '';
        userNickname = 'LumiNya';
        document.getElementById('nicknameInput').value = userNickname;
        document.getElementById('apiKeyInput').value = '';
        userNameDisplay.textContent = userNickname;
        renderAgentList();
        closeChat();
        closeSettings();
        chatMessages.innerHTML = '';
        chatTitle.textContent = '选择一个伙伴开始聊天';
        messageInput.disabled = true;
        sendBtn.disabled = true;
      }

      // ----- 右键菜单 -----
      let ctxMsgId = null;
      function showCtx(e, index) {
        e.preventDefault();
        ctxMsgId = index;
        contextMenu.innerHTML = '<div class="menu-item" data-act="copy">复制</div><div class="menu-item" data-act="delete">删除</div><div class="menu-item" data-act="quote">引用</div>';
        contextMenu.style.display = 'block';
        contextMenu.style.left = Math.min(e.clientX, window.innerWidth-150) + 'px';
        contextMenu.style.top = Math.min(e.clientY, window.innerHeight-120) + 'px';
      }
      chatMessages.addEventListener('contextmenu', e => {
        const el = e.target.closest('.msg');
        if (!el || !currentAgentId) return;
        const idx = parseInt(el.dataset.index, 10);
        if (!isNaN(idx)) showCtx(e, idx);
      });
      contextMenu.addEventListener('click', e => {
        const act = e.target.dataset.act;
        if (!act || ctxMsgId === null || !currentAgentId) return;
        const msgs = getAgentMessages(currentAgentId);
        if (ctxMsgId >= msgs.length) return;
        if (act === 'copy') {
          navigator.clipboard.writeText(msgs[ctxMsgId]?.content || '');
        } else if (act === 'delete') {
          msgs.splice(ctxMsgId, 1);
          messages[currentAgentId] = msgs;
          saveMessages();
          renderChatMessages();
          const last = msgs[msgs.length-1];
          updateAgentPreview(currentAgentId, last?.role === 'assistant' ? last.content : '');
        } else if (act === 'quote') {
          const text = msgs[ctxMsgId]?.content || '';
          messageInput.value = '「' + text.slice(0,40) + '」 ';
          messageInput.focus();
        }
        contextMenu.style.display = 'none';
        ctxMsgId = null;
      });
      document.addEventListener('click', () => { contextMenu.style.display = 'none'; ctxMsgId = null; });

      let pressTimer = null;
      chatMessages.addEventListener('touchstart', e => {
        const el = e.target.closest('.msg');
        if (!el) return;
        pressTimer = setTimeout(() => {
          const idx = parseInt(el.dataset.index, 10);
          if (!isNaN(idx)) {
            showCtx({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, preventDefault: ()=>{} }, idx);
          }
        }, 500);
      }, { passive: true });
      chatMessages.addEventListener('touchend', () => clearTimeout(pressTimer));
      chatMessages.addEventListener('touchmove', () => clearTimeout(pressTimer));

      // ----- 事件绑定 -----
      addAgentBtn.addEventListener('click', openAddModal);
      addModalOverlay.addEventListener('click', e => { if (e.target === addModalOverlay) closeAddModal(); });
      sendBtn.addEventListener('click', sendMessage);
      messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
      backBtn.addEventListener('click', closeChat);
      settingsBtn.addEventListener('click', openSettings);
      userAvatarBtn.addEventListener('click', openSettings);
      document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
      document.getElementById('testKeyBtn').addEventListener('click', testApiKey);
      document.getElementById('clearBtn').addEventListener('click', clearAllData);
      document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({ agents, messages, version:1 }, null, 2)], { type:'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'luminya_backup.json';
        a.click();
        URL.revokeObjectURL(a.href);
      });
      settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) closeSettings(); });

      // ===== 初始化 =====
      loadAgents();
      loadMessages();          // 尝试加载，含备份恢复
      renderAgentList();
      userNameDisplay.textContent = userNickname;
      messageInput.disabled = true;
      sendBtn.disabled = true;

      // 如果有智能体，自动选中第一个并显示历史消息
      if (agents.length > 0) {
        const first = agents[0];
        // 确保 messages 中有该智能体的记录（可能为空数组）
        if (!messages[first.id]) messages[first.id] = [];
        switchChat(first.id);
      } else {
        chatTitle.textContent = '添加你的第一个伙伴';
      }

      // 若数据恢复，强制保存一次以确保备份同步
      saveMessages();
    })();
  </script>
</body>
</html>
