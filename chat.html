<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>LumiNya · 陪伴聊天</title>

  <!-- 复用全局样式 -->
  <link rel="stylesheet" href="/css/main.css" />

  <!-- 补充聊天组件与本次调整的样式 -->
  <style>
    /* 全屏布局 */
    body {
      padding: 0 !important;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 100%;
      background: var(--bg-gradient);
    }

    /* 桌面端居中并限制宽度 */
    @media (min-width: 768px) {
      .app-container {
        max-width: 720px;
        margin: 0 auto;
        box-shadow: 0 0 40px rgba(0,0,0,0.05);
      }
      .msg {
        max-width: 70%;
      }
    }

    /* 顶部导航 */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1.2rem;
      background: var(--bg-soft);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
      z-index: 10;
    }
    .app-header .logo {
      font-size: 1.4rem;
      font-weight: 700;
      background: var(--hero-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-actions {
      display: flex;
      gap: 0.8rem;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.3rem;
      color: var(--text-medium);
      transition: color 0.2s;
      display: flex;
      align-items: center;
    }
    .icon-btn:hover {
      color: var(--primary-blue);
    }

    /* 聊天区域 */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.8rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 20%);
    }

    /* 消息气泡 */
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 20px;
      word-break: break-word;
      line-height: 1.5;
      font-size: 0.95rem;
      animation: fadeInUp 0.3s ease;
      position: relative;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--btn-gradient);
      color: #fff;
      border-bottom-right-radius: 6px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--widget-bg);
      backdrop-filter: blur(6px);
      color: var(--text-dark);
      border-bottom-left-radius: 6px;
      border: 1px solid var(--border-light);
    }

    /* 输入区域 */
    .input-area {
      display: flex;
      gap: 0.6rem;
      padding: 0.8rem 1rem 1rem;
      background: var(--bg-soft);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      background: var(--widget-bg);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 0.7rem 1.2rem;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus {
      border-color: var(--primary-blue);
    }
    .send-btn {
      background: var(--btn-gradient);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .send-btn:active {
      transform: scale(0.9);
    }

    /* 人格选择遮罩 */
    .persona-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .persona-card {
      background: var(--widget-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 28px;
      padding: 2rem 1.5rem;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }
    .persona-card h2 {
      margin-bottom: 1.5rem;
      color: var(--text-dark);
    }
    .persona-option {
      background: var(--bg-soft);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-dark);
    }
    .persona-option:hover,
    .persona-option.selected {
      border-color: var(--primary-blue);
      background: rgba(255,255,255,0.4);
    }

    /* 设置面板 */
    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 85%;
      max-width: 360px;
      height: 100%;
      background: var(--bg-soft);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-light);
      z-index: 200;
      padding: 1.5rem;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      overflow-y: auto;
      color: var(--text-dark);
    }
    .settings-panel.open {
      transform: translateX(0);
    }
    .settings-panel h3 {
      margin-bottom: 1.2rem;
    }
    .settings-row {
      margin-bottom: 1.2rem;
    }
    .settings-row label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .settings-row input {
      width: 100%;
      padding: 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      background: var(--widget-bg);
      color: var(--text-dark);
    }
    .danger-btn {
      background: #e0556a;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      margin-top: 0.5rem;
    }
    .close-settings {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-medium);
    }

    .storage-info {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.5rem;
    }

    /* 右键菜单 */
    .context-menu {
      position: fixed;
      background: var(--widget-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 0.4rem 0;
      z-index: 999;
      box-shadow: 0 12px 28px rgba(0,0,0,0.15);
      min-width: 120px;
      display: none;
    }
    .context-menu .menu-item {
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-dark);
      transition: background 0.15s;
    }
    .context-menu .menu-item:hover {
      background: rgba(107,159,212,0.15);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航 -->
    <header class="app-header">
      <span class="logo">LumiNya</span>
      <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" title="设置">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 聊天消息区 -->
    <div id="chatArea" class="chat-area"></div>

    <!-- 输入区域 -->
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="说点什么..." autocomplete="off" />
      <button id="sendBtn" class="send-btn">➤</button>
    </div>
  </div>

  <!-- 人格选择遮罩 -->
  <div id="personaOverlay" class="persona-overlay" style="display: none;">
    <div class="persona-card">
      <h2>选择陪伴人格</h2>
      <div id="personaOptions"></div>
      <button id="confirmPersonaBtn" class="btn btn--primary" style="margin-top: 1.2rem; width: 100%;" disabled>确认选择</button>
      <p style="font-size: 0.75rem; margin-top: 0.8rem; color: var(--text-light);">选定后不可更改，如需更换请清除浏览器数据</p>
    </div>
  </div>

  <!-- 设置面板 -->
  <div id="settingsPanel" class="settings-panel">
    <button id="closeSettingsBtn" class="close-settings">✕</button>
    <h3>设置</h3>
    <div class="settings-row">
      <label>当前人格</label>
      <p id="currentPersonaDisplay" style="font-weight: 600;"></p>
    </div>
    <div class="settings-row">
      <label>你的 DeepSeek API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-..." />
      <button id="testKeyBtn" class="btn btn--outline" style="margin-top: 0.5rem; width: 100%;">测试可用性</button>
      <p id="testKeyStatus" style="font-size: 0.8rem; margin-top: 0.4rem; min-height: 1.2em;"></p>
      <p style="font-size: 0.7rem; color: var(--text-light);">密钥仅保存在本地，不会上传</p>
    </div>
    <div class="settings-row">
      <label>对话记录</label>
      <p id="messageCount" style="margin-bottom: 0.3rem;"></p>
      <div class="storage-info" id="storageUsed"></div>
      <button id="clearChatBtn" class="danger-btn">清除所有对话</button>
      <button id="resetAllBtn" class="danger-btn" style="margin-top: 0.5rem;">重置应用（重新选择人格）</button>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div id="contextMenu" class="context-menu"></div>

  <script>
  (function() {
    const DEEPSEEK_API = 'https://api.deepseek.com/v1/chat/completions';
    const MAX_MESSAGES = 200;
    const CONTEXT_COUNT = 20;

    let PERSONAS = null;          // 从 prompt.json 加载
    let config = null;            // 用户配置
    let messages = [];            // 对话记录

    // ==================== 本地存储 ====================
    function loadConfig() {
      const raw = localStorage.getItem('luminya_config');
      return raw ? JSON.parse(raw) : null;
    }
    function saveConfig(conf) {
      localStorage.setItem('luminya_config', JSON.stringify(conf));
    }
    function loadMessages() {
      const raw = localStorage.getItem('luminya_messages');
      return raw ? JSON.parse(raw) : [];
    }
    function saveMessages(msgs) {
      const trimmed = msgs.slice(-MAX_MESSAGES);
      localStorage.setItem('luminya_messages', JSON.stringify(trimmed));
    }
    function updateStorageUI() {
      const msgCount = messages.length;
      document.getElementById('messageCount').textContent = `共 ${msgCount} 条消息`;
      let totalBytes = 0;
      for (let key in localStorage) {
        if (localStorage.hasOwnProperty(key)) {
          totalBytes += localStorage[key].length + key.length;
        }
      }
      document.getElementById('storageUsed').textContent = `已使用 ${(totalBytes / 1024).toFixed(1)} KB / 约 5 MB 可用`;
    }

    // ==================== 聊天渲染 ====================
    function renderChat() {
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = '';
      messages.forEach(msg => appendMessageToDOM(msg.role, msg.content));
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    function appendMessageToDOM(role, content) {
      const chatArea = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = content;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    let currentAssistantDiv = null;
    function appendStreamChunk(chunk) {
      if (!currentAssistantDiv) {
        currentAssistantDiv = document.createElement('div');
        currentAssistantDiv.className = 'msg assistant';
        document.getElementById('chatArea').appendChild(currentAssistantDiv);
      }
      currentAssistantDiv.textContent += chunk;
      document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
    }
    function finalizeAssistantMessage() {
      if (currentAssistantDiv) {
        const content = currentAssistantDiv.textContent;
        messages.push({ role: 'assistant', content, time: Date.now() });
        saveMessages(messages);
        updateStorageUI();
        currentAssistantDiv = null;
      }
    }

    // ==================== 人格选择界面 ====================
    function showPersonaSelector() {
      const overlay = document.getElementById('personaOverlay');
      overlay.style.display = 'flex';
      const container = document.getElementById('personaOptions');
      container.innerHTML = '';
      let selectedPersona = null;
      Object.entries(PERSONAS).forEach(([key, val]) => {
        const div = document.createElement('div');
        div.className = 'persona-option';
        div.textContent = val.name;
        div.addEventListener('click', () => {
          document.querySelectorAll('.persona-option').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          selectedPersona = key;
          document.getElementById('confirmPersonaBtn').disabled = false;
        });
        container.appendChild(div);
      });
      document.getElementById('confirmPersonaBtn').addEventListener('click', () => {
        if (!selectedPersona) return;
        config = { persona: selectedPersona, ownApiKey: '', chatCount: 0 };
        saveConfig(config);
        document.getElementById('currentPersonaDisplay').textContent = PERSONAS[selectedPersona].name;
        overlay.style.display = 'none';
        messages = [];
        saveMessages([]);
        renderChat();
        updateStorageUI();
      }, { once: true });
    }

    // ==================== 发送消息 ====================
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      const apiKey = config?.ownApiKey;
      if (!apiKey) {
        alert('请先在设置中填写你的 DeepSeek API Key');
        return;
      }
      messages.push({ role: 'user', content: text, time: Date.now() });
      saveMessages(messages);
      appendMessageToDOM('user', text);
      input.value = '';
      updateStorageUI();

      const systemPrompt = PERSONAS[config.persona].prompt;
      const recentMessages = messages.slice(-CONTEXT_COUNT);
      const apiMessages = [
        { role: 'system', content: systemPrompt },
        ...recentMessages.map(m => ({ role: m.role, content: m.content }))
      ];

      try {
        const response = await fetch(DEEPSEEK_API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: apiMessages,
            stream: true
          })
        });
        if (!response.ok) {
          const err = await response.text();
          throw new Error(`API 错误 ${response.status}: ${err}`);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6).trim();
              if (data === '[DONE]') {
                finalizeAssistantMessage();
                return;
              }
              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content;
                if (content) appendStreamChunk(content);
              } catch(e) {}
            }
          }
        }
        finalizeAssistantMessage();
      } catch (error) {
        console.error(error);
        alert('发送失败：' + error.message);
        messages.pop();
        saveMessages(messages);
        renderChat();
        updateStorageUI();
      }
    }

    // ==================== 测试 API Key ====================
    async function testApiKey() {
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const statusEl = document.getElementById('testKeyStatus');
      if (!apiKey) {
        statusEl.textContent = '请先输入 Key';
        statusEl.style.color = 'var(--text-medium)';
        return;
      }
      statusEl.textContent = '正在测试...';
      statusEl.style.color = 'var(--text-medium)';
      try {
        const res = await fetch('https://api.deepseek.com/models', {
          headers: { 'Authorization': `Bearer ${apiKey}` }
        });
        if (res.ok) {
          statusEl.textContent = '恭喜，密钥配置成功';
          statusEl.style.color = '#4caf50';
        } else {
          throw new Error('Invalid key');
        }
      } catch (e) {
        statusEl.textContent = '密钥不可用，请检查网络或密钥';
        statusEl.style.color = '#e0556a';
      }
    }

    // ==================== 右键 / 长按菜单 ====================
    const contextMenu = document.getElementById('contextMenu');
    let currentMsgIndex = -1;

    function showContextMenu(pos, msgIndex) {
      const clientX = pos.clientX || (pos.touches && pos.touches[0].clientX);
      const clientY = pos.clientY || (pos.touches && pos.touches[0].clientY);
      currentMsgIndex = msgIndex;
      contextMenu.innerHTML = `
        <div class="menu-item" data-action="copy">复制</div>
        <div class="menu-item" data-action="delete">删除（仅本地）</div>
        <div class="menu-item" data-action="quote">引用</div>
      `;
      contextMenu.style.display = 'block';
      contextMenu.style.left = Math.min(clientX, window.innerWidth - 150) + 'px';
      contextMenu.style.top = Math.min(clientY, window.innerHeight - 150) + 'px';
    }
    function hideContextMenu() {
      contextMenu.style.display = 'none';
    }

    document.getElementById('chatArea').addEventListener('contextmenu', (e) => {
      const msgDiv = e.target.closest('.msg');
      if (!msgDiv) return;
      const allMsgs = [...document.querySelectorAll('.msg')];
      const index = allMsgs.indexOf(msgDiv);
      if (index === -1) return;
      showContextMenu(e, index);
    });

    contextMenu.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (!action) return;
      const msg = messages[currentMsgIndex];
      if (!msg) return;
      if (action === 'copy') {
        navigator.clipboard.writeText(msg.content);
      } else if (action === 'delete') {
        messages.splice(currentMsgIndex, 1);
        saveMessages(messages);
        renderChat();
        updateStorageUI();
      } else if (action === 'quote') {
        const quoted = `「${msg.content.substring(0, 50)}${msg.content.length > 50 ? '...' : ''}」`;
        document.getElementById('messageInput').value = quoted + ' ';
        document.getElementById('messageInput').focus();
      }
      hideContextMenu();
    });

    document.addEventListener('click', hideContextMenu);

    let longPressTimer;
    document.getElementById('chatArea').addEventListener('touchstart', (e) => {
      const msgDiv = e.target.closest('.msg');
      if (!msgDiv) return;
      longPressTimer = setTimeout(() => {
        const allMsgs = [...document.querySelectorAll('.msg')];
        const index = allMsgs.indexOf(msgDiv);
        if (index === -1) return;
        showContextMenu(e, index);
      }, 500);
    });
    document.getElementById('chatArea').addEventListener('touchend', () => clearTimeout(longPressTimer));
    document.getElementById('chatArea').addEventListener('touchmove', () => clearTimeout(longPressTimer));

    // ==================== 初始化入口 ====================
    async function initApp() {
      try {
        const resp = await fetch('chat_files/prompt.json');
        if (!resp.ok) throw new Error('无法加载人格配置');
        PERSONAS = await resp.json();
      } catch (e) {
        alert('人格配置加载失败，请刷新页面重试');
        return;
      }

      // 加载本地数据
      config = loadConfig();
      messages = loadMessages();

      if (!config || !config.persona) {
        showPersonaSelector();
      } else {
        document.getElementById('currentPersonaDisplay').textContent = PERSONAS[config.persona]?.name || '未知';
        if (config.ownApiKey) {
          document.getElementById('apiKeyInput').value = config.ownApiKey;
        }
      }
      renderChat();
      updateStorageUI();

      // 设置面板开关
      const settingsPanel = document.getElementById('settingsPanel');
      document.getElementById('settingsBtn').addEventListener('click', () => {
        settingsPanel.classList.add('open');
        document.getElementById('apiKeyInput').value = config?.ownApiKey || '';
        updateStorageUI();
      });
      document.getElementById('closeSettingsBtn').addEventListener('click', () => {
        settingsPanel.classList.remove('open');
        if (config) {
          config.ownApiKey = document.getElementById('apiKeyInput').value.trim();
          saveConfig(config);
        }
      });

      // 测试 Key 按钮
      document.getElementById('testKeyBtn').addEventListener('click', testApiKey);

      // 发送按钮
      document.getElementById('sendBtn').addEventListener('click', sendMessage);
      document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });

      // 清除对话
      document.getElementById('clearChatBtn').addEventListener('click', () => {
        if (confirm('确定要清除所有聊天记录吗？')) {
          messages = [];
          saveMessages([]);
          renderChat();
          updateStorageUI();
        }
      });

      // 重置应用
      document.getElementById('resetAllBtn').addEventListener('click', () => {
        if (confirm('确定要重置所有数据并重新选择人格吗？')) {
          localStorage.removeItem('luminya_messages');
          localStorage.removeItem('luminya_config');
          config = null;
          messages = [];
          renderChat();
          updateStorageUI();
          settingsPanel.classList.remove('open');
          showPersonaSelector();
        }
      });
    }

    initApp();
  })();
</script>
</body>
</html>
