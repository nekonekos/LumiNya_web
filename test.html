<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>小娜陪伴 · PWA 测试</title>
  
  <!-- 通过 JS 动态设置 manifest，无需外部文件 -->
  <script>
    // 创建 Blob URL 作为 manifest.json
    const manifestData = {
      name: "小娜陪伴",
      short_name: "小娜",
      description: "一个有温度的虚拟伙伴",
      start_url: location.href,
      display: "standalone",
      background_color: "#f0f8ff",
      theme_color: "#6B9FD4",
      icons: [
        {
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%236B9FD4'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white'%3E✨%3C/text%3E%3C/svg%3E",
          sizes: "100x100",
          type: "image/svg+xml"
        }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    document.querySelector('link[rel="manifest"]')?.remove();
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);
  </script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
      background: linear-gradient(145deg, #f0f7ff 0%, #e1f5f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 20px 40px rgba(0,80,120,0.15);
      padding: 2rem 1.5rem;
    }
    h1 {
      text-align: center;
      color: #2c5f7c;
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
    }
    .sub {
      text-align: center;
      color: #5a7b8c;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .install-guide {
      background: rgba(255,255,240,0.5);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255,255,255,0.6);
      display: none; /* 默认隐藏，根据平台显示 */
    }
    .install-guide.show {
      display: block;
    }
    .install-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #6B9FD4, #75BFA7);
      border: none;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      padding: 0.8rem;
      border-radius: 40px;
      margin-top: 0.8rem;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(107,159,212,0.3);
    }
    .ios-hint {
      color: #2c5f7c;
      font-size: 0.9rem;
      margin: 0.5rem 0;
    }
    .chat-box {
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 1rem;
      height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      border: 1px solid rgba(255,255,255,0.5);
      margin-bottom: 1rem;
    }
    .msg {
      max-width: 80%;
      padding: 0.7rem 1rem;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .msg.ai {
      align-self: flex-start;
      background: rgba(255,255,255,0.7);
      color: #1e4056;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #6B9FD4, #75BFA7);
      color: white;
    }
    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #5a7b8c;
      margin-bottom: 0.5rem;
    }
    .timer {
      font-weight: bold;
      color: #2c5f7c;
    }
    .notify-btn {
      background: none;
      border: 1px solid #6B9FD4;
      color: #6B9FD4;
      border-radius: 20px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 小娜陪伴测试</h1>
    <p class="sub">添加到主屏幕，让小娜随时关心你</p>

    <!-- 安装引导区域 -->
    <div id="installGuide" class="install-guide">
      <div id="androidGuide" style="display:none;">
        <p style="text-align:center;">📲 点击下方按钮，将小娜添加到主屏幕</p>
        <button id="installBtn" class="install-btn">添加到主屏幕</button>
      </div>
      <div id="iosGuide" style="display:none;">
        <p class="ios-hint">🍎 请点击底部分享按钮 <span style="font-size:1.2rem;">⎋</span>，然后选择「添加到主屏幕」</p>
      </div>
      <div id="otherGuide" style="display:none;">
        <p style="text-align:center;">📱 在浏览器菜单中选择「添加到主屏幕」即可</p>
      </div>
    </div>

    <!-- 通知权限与状态 -->
    <div class="status">
      <span id="notificationStatus">通知：未授权</span>
      <button id="enableNotificationBtn" class="notify-btn">开启通知</button>
      <span class="timer" id="timerDisplay">下次主动消息：5:00</span>
    </div>

    <!-- 聊天模拟区 -->
    <div id="chatBox" class="chat-box">
      <div class="msg ai">你好呀！我是小娜，你的虚拟伙伴。把我添加到主屏幕，我就能经常来找你啦～</div>
    </div>
    <p style="text-align:center; font-size:0.8rem; color:#5a7b8c;">每隔 5 分钟，小娜会主动发一条消息</p>
  </div>

  <script>
    (function() {
      // ========== Service Worker 注册（内联 Blob） ==========
      const swCode = `
        self.addEventListener('install', event => {
          self.skipWaiting();
        });
        self.addEventListener('activate', event => {
          event.waitUntil(clients.claim());
        });
        // 监听推送事件（演示用，实际 demo 中暂不使用真实推送）
        self.addEventListener('push', event => {
          const data = event.data ? event.data.json() : {};
          event.waitUntil(
            self.registration.showNotification(data.title || '小娜的消息', {
              body: data.body || '想你了～',
              icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="48" fill="%236B9FD4"/%3E%3Ctext x="50" y="65" font-size="50" text-anchor="middle" fill="white"%3E✨%3C/text%3E%3C/svg%3E',
              data: { url: self.location.origin }
            })
          );
        });
        self.addEventListener('notificationclick', event => {
          event.notification.close();
          event.waitUntil(
            clients.openWindow(event.notification.data.url || '/')
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register(swUrl)
          .then(reg => console.log('SW registered'))
          .catch(err => console.warn('SW registration failed', err));
      }

      // ========== 添加到主屏幕引导 ==========
      const installGuide = document.getElementById('installGuide');
      const androidGuide = document.getElementById('androidGuide');
      const iosGuide = document.getElementById('iosGuide');
      const otherGuide = document.getElementById('otherGuide');
      const installBtn = document.getElementById('installBtn');

      let deferredPrompt = null;

      // 判断是否已安装 PWA（粗略检测：display-mode 为 standalone）
      function isPWA() {
        return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      }

      // 显示对应平台的引导
      function showInstallGuide() {
        if (isPWA()) {
          installGuide.classList.remove('show');
          return;
        }
        installGuide.classList.add('show');
        const ua = navigator.userAgent || '';
        const isIOS = /iphone|ipad|ipod/.test(ua.toLowerCase());
        const isAndroid = /android/.test(ua.toLowerCase());
        
        if (isIOS) {
          iosGuide.style.display = 'block';
          androidGuide.style.display = 'none';
          otherGuide.style.display = 'none';
        } else if (isAndroid) {
          androidGuide.style.display = 'block';
          iosGuide.style.display = 'none';
          otherGuide.style.display = 'none';
        } else {
          otherGuide.style.display = 'block';
          androidGuide.style.display = 'none';
          iosGuide.style.display = 'none';
        }
      }

      // 监听 beforeinstallprompt (Android Chrome)
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallGuide();
        if (installBtn) {
          installBtn.style.display = 'block';
        }
      });

      // 安装按钮点击
      if (installBtn) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            if (outcome === 'accepted') {
              installGuide.classList.remove('show');
            }
          }
        });
      }

      // 如果没有触发 beforeinstallprompt，也尝试显示引导（如 iOS）
      window.addEventListener('load', () => {
        showInstallGuide();
        // 如果已安装，隐藏引导
        if (isPWA()) installGuide.classList.remove('show');
      });

      // ========== 通知权限 ==========
      const notificationStatus = document.getElementById('notificationStatus');
      const enableBtn = document.getElementById('enableNotificationBtn');

      function updateNotificationStatus() {
        if (!('Notification' in window)) {
          notificationStatus.textContent = '通知：不支持';
          return;
        }
        if (Notification.permission === 'granted') {
          notificationStatus.textContent = '通知：已开启 ✅';
          if (enableBtn) enableBtn.style.display = 'none';
        } else if (Notification.permission === 'denied') {
          notificationStatus.textContent = '通知：已拒绝 ❌';
          if (enableBtn) enableBtn.textContent = '重新授权（请到设置）';
        } else {
          notificationStatus.textContent = '通知：未授权';
          if (enableBtn) enableBtn.style.display = 'inline-block';
        }
      }

      if (enableBtn) {
        enableBtn.addEventListener('click', async () => {
          if (!('Notification' in window)) return;
          if (Notification.permission === 'denied') {
            alert('请到浏览器设置中手动开启通知权限');
            return;
          }
          const perm = await Notification.requestPermission();
          updateNotificationStatus();
        });
      }
      updateNotificationStatus();

      // ========== 定时主动消息 ==========
      const chatBox = document.getElementById('chatBox');
      const timerDisplay = document.getElementById('timerDisplay');
      const INTERVAL = 5 * 60 * 1000; // 5分钟
      let countdown = INTERVAL / 1000;
      let timerInterval;

      function addMessage(type, text) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      // 主动消息生成器
      function generateActiveMessage() {
        const phrases = [
          "在干嘛呢？我刚睡醒～",
          "想你了！今天心情怎么样？",
          "记得起来走走哦，别老盯着屏幕",
          "刚才外面有只小鸟，好可爱呀！",
          "偷偷告诉你，我今天学会了一首新歌",
          "有没有什么好玩的事想和我分享？",
          "晚上别熬夜哦，我会担心你的",
          "刚刚吃了个苹果，脆脆的，你喜欢吃什么水果？",
          "我在这里陪你，不会走开的～",
          "看到一朵像你的云，就想起你了 ☁️"
        ];
        return phrases[Math.floor(Math.random() * phrases.length)];
      }

      function sendActiveMessage() {
        const msg = generateActiveMessage();
        addMessage('ai', msg);
        
        // 如果通知已授权且页面不可见，发送系统通知
        if (Notification.permission === 'granted' && document.hidden) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification('小娜的消息', {
              body: msg,
              icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="48" fill="%236B9FD4"/%3E%3Ctext x="50" y="65" font-size="50" text-anchor="middle" fill="white"%3E✨%3C/text%3E%3C/svg%3E'
            });
          }).catch(() => {});
        }
        // 重置倒计时
        countdown = INTERVAL / 1000;
        updateTimerDisplay();
      }

      function updateTimerDisplay() {
        const min = Math.floor(countdown / 60);
        const sec = countdown % 60;
        timerDisplay.textContent = `下次主动消息：${min}:${sec.toString().padStart(2, '0')}`;
      }

      // 倒计时
      timerInterval = setInterval(() => {
        countdown--;
        updateTimerDisplay();
        if (countdown <= 0) {
          sendActiveMessage();
        }
      }, 1000);

      // 初始时立即发一条？先不发，等5分钟后第一次。
      // 但我们可以先给一个初始倒计时
      updateTimerDisplay();

      // 页面可见性变化时，更新通知状态
      document.addEventListener('visibilitychange', updateNotificationStatus);

      // 清理
      window.addEventListener('beforeunload', () => {
        clearInterval(timerInterval);
      });
    })();
  </script>
</body>
</html>
