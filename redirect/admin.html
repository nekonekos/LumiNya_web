<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>asy.wiki · Link desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/redirect.css">
</head>
<body class="admin-page">
    <main class="admin-shell">
        <header class="admin-header">
            <div>
                <p class="eyebrow">ASY.WIKI / LINK DESK</p>
                <h1>短链接管理</h1>
            </div>
            <button id="logout" class="button button--quiet" type="button" hidden>退出</button>
        </header>

        <section id="login-panel" class="panel login-panel">
            <p class="panel-kicker">PRIVATE ACCESS</p>
            <h2>进入你的链接库</h2>
            <p>管理接口只接受 Workers Secret 中的口令。</p>
            <form id="login-form">
                <label for="token">管理口令</label>
                <input id="token" name="token" type="password" autocomplete="current-password" required>
                <button class="button button--primary" type="submit">验证并进入</button>
            </form>
            <p id="login-error" class="form-error" role="alert"></p>
        </section>

        <section id="desk-panel" hidden>
            <form id="link-form" class="panel link-form">
                <div class="form-heading">
                    <div><p class="panel-kicker">NEW / EDIT</p><h2 id="form-title">新增短链接</h2></div>
                    <button id="cancel-edit" class="button button--quiet" type="button" hidden>取消编辑</button>
                </div>
                <div class="form-grid">
                    <label>短码<input id="code" name="code" pattern="[a-z0-9][a-z0-9-_]{1,63}" placeholder="例如 docs" required></label>
                    <label>显示名称<input id="title" name="title" maxlength="120" placeholder="可选，例如项目文档"></label>
                    <label class="field-wide">目标地址<input id="target" name="target" type="url" placeholder="https://example.com/path" required></label>
                    <label class="switch-line"><input id="enabled" name="enabled" type="checkbox" checked><span>启用这个短链接</span></label>
                </div>
                <button class="button button--primary" type="submit">保存短链接</button>
                <p id="form-error" class="form-error" role="alert"></p>
            </form>

            <div class="list-heading"><div><p class="panel-kicker">LINK LIBRARY</p><h2>已保存的链接</h2></div><span id="count" class="count"></span></div>
            <div id="links" class="link-list"></div>
        </section>
    </main>
    <script>
        (() => {
            const state = { token: sessionStorage.getItem('asy-admin-token') || '', editing: null };
            const $ = (selector) => document.querySelector(selector);
            const loginPanel = $('#login-panel');
            const deskPanel = $('#desk-panel');

            function authHeaders() { return { Authorization: `Bearer ${state.token}`, 'Content-Type': 'application/json' }; }
            function setError(selector, text) { $(selector).textContent = text || ''; }
            function resetForm() {
                $('#link-form').reset();
                $('#enabled').checked = true;
                state.editing = null;
                $('#code').disabled = false;
                $('#form-title').textContent = '新增短链接';
                $('#cancel-edit').hidden = true;
            }
            async function request(url, options = {}) {
                const response = await fetch(url, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(body.error || '请求失败');
                return body;
            }
            function renderLinks(links) {
                $('#count').textContent = `${links.length} 条`;
                $('#links').innerHTML = links.length ? links.map((link) => `
                    <article class="link-row ${link.enabled ? '' : 'is-disabled'}">
                        <div class="link-code"><a href="/${encodeURIComponent(link.code)}" target="_blank" rel="noreferrer">/${link.code}</a><span class="status">${link.enabled ? 'ACTIVE' : 'PAUSED'}</span></div>
                        <div class="link-info"><strong>${escapeHtml(link.title || '未命名链接')}</strong><span>${escapeHtml(link.target)}</span></div>
                        <div class="row-actions"><button class="text-button" data-edit="${escapeHtml(link.code)}" type="button">编辑</button><button class="text-button text-button--danger" data-delete="${escapeHtml(link.code)}" type="button">删除</button></div>
                    </article>`).join('') : '<div class="empty-state">还没有短链接，先创建第一条。</div>';
            }
            function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
            async function loadLinks() { const data = await request('/api/admin/links'); renderLinks(data.links || []); }
            function enterDesk() { loginPanel.hidden = true; deskPanel.hidden = false; $('#logout').hidden = false; loadLinks().catch((error) => setError('#form-error', error.message)); }

            $('#login-form').addEventListener('submit', async (event) => {
                event.preventDefault(); setError('#login-error', '');
                const token = $('#token').value;
                try { const response = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) }); if (!response.ok) throw new Error('口令错误'); state.token = token; sessionStorage.setItem('asy-admin-token', token); enterDesk(); } catch (error) { setError('#login-error', error.message); }
            });
            $('#link-form').addEventListener('submit', async (event) => {
                event.preventDefault(); setError('#form-error', '');
                const payload = { code: $('#code').value, title: $('#title').value, target: $('#target').value, enabled: $('#enabled').checked };
                try { await request('/api/admin/links', { method: state.editing ? 'PUT' : 'POST', body: JSON.stringify(payload) }); resetForm(); await loadLinks(); } catch (error) { setError('#form-error', error.message); }
            });
            $('#links').addEventListener('click', async (event) => {
                const editCode = event.target.dataset.edit; const deleteCode = event.target.dataset.delete;
                if (editCode) { const link = (await request('/api/admin/links')).links.find((item) => item.code === editCode); if (!link) return; state.editing = editCode; $('#code').value = link.code; $('#code').disabled = true; $('#title').value = link.title; $('#target').value = link.target; $('#enabled').checked = Boolean(link.enabled); $('#form-title').textContent = '编辑短链接'; $('#cancel-edit').hidden = false; window.scrollTo({ top: 0, behavior: 'smooth' }); }
                if (deleteCode && confirm(`确认删除 /${deleteCode}？`)) { try { await request('/api/admin/links', { method: 'DELETE', body: JSON.stringify({ code: deleteCode }) }); await loadLinks(); } catch (error) { setError('#form-error', error.message); } }
            });
            $('#cancel-edit').addEventListener('click', resetForm);
            $('#logout').addEventListener('click', () => { sessionStorage.removeItem('asy-admin-token'); state.token = ''; location.reload(); });
            if (state.token) enterDesk();
        })();
    </script>
</body>
</html>
