# wrangler.toml
# 此文件仅用于标识 Worker 基本信息和公开变量。
# 所有敏感信息（D1 绑定、ADMIN_PASSWORD、JWT_SECRET 等）都已在 Cloudflare 仪表盘中设置，
# 不会受此文件影响。

name = "luminya-shop"
main = "src/index.js"
compatibility_date = "2026-08-20"

# 公开变量（非敏感）
[vars]
SITE_NAME = "LumiNya Shop"
SITE_ANNOUNCEMENT = ""

# 注意：
# 1. 没有 [[d1_databases]] 配置 → 不会覆盖仪表盘中的 D1 绑定
# 2. 没有 ADMIN_* 或 JWT_SECRET → 不会覆盖仪表盘中的 Secrets
# 3. keep_vars 已移除 → 因为没必要，且 Pages 环境可能不生效