name = "luminya-shop-api"
main = "src/index.js"
compatibility_date = "2026-08-20"

[[d1_databases]]
binding = "DB"
database_name = "luminya-shop"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# 站点信息（前端也会读取 /api/site）
SITE_NAME = "LumiNya Shop"
SITE_ANNOUNCEMENT = ""

# 管理员种子账号：首次请求时若不存在管理员则自动创建。
# 部署后请务必通过 `wrangler secret put` 覆盖为强密码，或直接放在 secret 中。
ADMIN_EMAIL = "admin@luminya.cc"
ADMIN_PASSWORD = "change-me-now"

# JWT 签名密钥：务必使用 `wrangler secret put JWT_SECRET` 覆盖。
JWT_SECRET = "dev-only-insecure-secret-change-me"

# 支付宝「AI 付」预留配置（真实凭证后续填入 secret）
ALIPAY_APP_ID = ""
ALIPAY_PRIVATE_KEY = ""
ALIPAY_PUBLIC_KEY = ""
ALIPAY_NOTIFY_URL = ""
ALIPAY_RETURN_URL = ""
