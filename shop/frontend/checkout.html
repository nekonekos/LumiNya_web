<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>结算 · LumiNya Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/shop.css" />
</head>
<body>
    <div class="container">
        <div id="pageContent"></div>
    </div>

    <script src="./js/ui.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/shop.js"></script>
    <script>
        (async function () {
            await initCommon();

            if (!isLoggedIn()) {
                toast('请先登录', 'err');
                setTimeout(() => { location.href = 'login.html?redirect=checkout.html'; }, 600);
                return;
            }

            const content = document.getElementById('pageContent');
            const params = new URLSearchParams(location.search);
            const buynow = params.get('buynow') === '1';
            const sel = params.get('sel') === '1';

            let items = buynow ? Store.cart.filter(i => i.buynow) : (sel ? selectedItems() : Store.cart);

            if (!items.length) {
                content.innerHTML = '<div class="empty-state">没有要结算的商品</div>';
                return;
            }

            // 回验价格与库存
            await revalidateCart();
            items = buynow ? Store.cart.filter(i => i.buynow) : (sel ? selectedItems() : Store.cart);
            if (!items.length) { content.innerHTML = '<div class="empty-state">没有要结算的商品</div>'; return; }

            const hasPhysical = items.some(i => i.type === 'physical');
            let addresses = getAddresses();
            let selectedAddr = addresses.find(a => a.id === localStorage.getItem('luminya-shop-address')) || defaultAddress();
            let payChannel = 'alipay';
            let quote = null;

            render();
            fetchQuote();

            function buildItemsPayload() { return items.map(i => ({ product_id: i.product_id, variant_id: i.variant_id, qty: i.qty })); }
            function subtotalOf() { return items.reduce((s, i) => s + i.unit_price * i.qty, 0); }

            async function fetchQuote() {
                try {
                    const res = await api('/orders/quote', { method: 'POST', body: { items: buildItemsPayload() } });
                    quote = res.quote;
                } catch (e) { quote = null; }
                renderSummary();
            }

            function render() {
                const rows = items.map(item => `
                    <div class="cart-item">
                        <div class="thumb">${item.image ? `<img src="${escapeHtml(item.image)}" alt="" />` : '🛍️'}</div>
                        <div class="info">
                            <div class="name">${escapeHtml(item.title)}</div>
                            ${item.sku_name ? `<div class="sku">${escapeHtml(item.sku_name)}</div>` : ''}
                            <div class="unit">${formatPrice(item.unit_price)} × ${item.qty}</div>
                        </div>
                        <div class="subtotal">${formatPrice(item.unit_price * item.qty)}</div>
                    </div>`).join('');

                const addrSection = hasPhysical ? `
                    <div class="form-card" style="max-width:none;margin-top:1.5rem;">
                        <h3 style="display:flex;align-items:center;gap:0.6rem;">收货地址 <button class="btn btn--ghost btn--small" id="newAddr">＋ 新增</button></h3>
                        <div id="addrList">${addresses.length ? addresses.map(a => `
                            <div class="address-card ${selectedAddr && selectedAddr.id === a.id ? 'active' : ''}" data-id="${escapeHtml(a.id)}">
                                <input type="radio" name="addr" ${selectedAddr && selectedAddr.id === a.id ? 'checked' : ''} />
                                <div class="addr-main">
                                    <div class="addr-line">${escapeHtml(a.name || '')} ${escapeHtml(a.phone || '')}${a.isDefault ? '<span class="badge badge--new">默认</span>' : ''}</div>
                                    <div class="addr-detail">${escapeHtml(a.detail || '')}</div>
                                </div>
                                <div class="addr-actions"><a data-edit="${escapeHtml(a.id)}">编辑</a><a data-del="${escapeHtml(a.id)}">删除</a></div>
                            </div>`).join('') : `<div class="empty-state" style="padding:1rem;">还没有收货地址，请新增</div>`}</div>
                    </div>` : '';

                content.innerHTML = `
                    <div class="section-wrapper">
                        <div class="section-header"><h2 class="section-title">确认订单</h2></div>
                        <div class="section-divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
                        <div class="checkout-layout">
                            <div class="checkout-main">
                                ${addrSection}
                                <div class="form-card" style="max-width:none;margin-top:1.5rem;">
                                    <h3>支付方式</h3>
                                    <div class="pay-methods" id="payMethods">
                                        <div class="pay-method active" data-pay="alipay">💰 支付宝 <span style="margin-left:auto;">推荐</span></div>
                                        <div class="pay-method" data-pay="wechat" disabled>💬 微信支付 <span style="margin-left:auto;">即将上线</span></div>
                                    </div>
                                </div>
                                <div class="form-card" style="max-width:none;margin-top:1.5rem;">
                                    <h3>订单备注</h3>
                                    <div class="form-field"><textarea id="remark" placeholder="选填"></textarea></div>
                                    <div class="form-error" id="formError"></div>
                                    <button class="btn btn--primary" id="submitBtn" style="width:100%;">提交订单</button>
                                </div>
                            </div>
                            <aside class="summary-card">
                                <h3 style="margin-bottom:0.6rem;">订单摘要</h3>
                                <div class="row"><span>商品小计</span><span id="sumSubtotal">${formatPrice(subtotalOf())}</span></div>
                                <div class="row"><span>运费</span><span id="sumShipping">${quote ? (quote.shipping_fee ? formatPrice(quote.shipping_fee) : '免运费') : '下单时计算'}</span></div>
                                <div class="row total"><span>实付</span><span id="sumTotal">${quote ? formatPrice(quote.total) : '下单时计算'}</span></div>
                                <button class="btn btn--primary" id="sidebarSubmit">提交订单</button>
                            </aside>
                        </div>
                        <div class="mobile-cart-bar">
                            <div class="m-total"><span>实付</span><strong id="mTotal">${quote ? formatPrice(quote.total) : '下单时计算'}</strong></div>
                            <button class="btn btn--primary" id="mobileSubmit">提交订单</button>
                        </div>
                    </div>`;

                bind();
            }

            function renderSummary() {
                const shippingEl = document.getElementById('sumShipping');
                const totalEl = document.getElementById('sumTotal');
                const mTotal = document.getElementById('mTotal');
                if (shippingEl) shippingEl.textContent = quote ? (quote.shipping_fee ? formatPrice(quote.shipping_fee) : '免运费') : '下单时计算';
                const totalText = quote ? formatPrice(quote.total) : '下单时计算';
                if (totalEl) totalEl.textContent = totalText;
                if (mTotal) mTotal.textContent = totalText;
            }

            function bind() {
                document.getElementById('submitBtn').addEventListener('click', submitOrder);
                document.getElementById('sidebarSubmit').addEventListener('click', submitOrder);
                document.getElementById('mobileSubmit').addEventListener('click', submitOrder);

                content.querySelectorAll('.pay-method').forEach(m => {
                    m.addEventListener('click', () => {
                        if (m.disabled) return toast('该支付方式即将上线', 'err');
                        payChannel = m.dataset.pay;
                        content.querySelectorAll('.pay-method').forEach(x => x.classList.toggle('active', x === m));
                    });
                });

                if (hasPhysical) {
                    content.querySelectorAll('.address-card').forEach(card => {
                        card.addEventListener('click', (e) => {
                            if (e.target.closest('[data-edit]') || e.target.closest('[data-del]')) return;
                            selectedAddr = addresses.find(a => a.id === card.dataset.id);
                            localStorage.setItem('luminya-shop-address', selectedAddr.id);
                            content.querySelectorAll('.address-card').forEach(c => c.classList.toggle('active', c === card));
                            content.querySelectorAll('input[name="addr"]').forEach(r => r.checked = r.closest('.address-card') === card);
                        });
                    });
                    const newBtn = document.getElementById('newAddr');
                    if (newBtn) newBtn.addEventListener('click', () => openAddrModal());
                    content.querySelectorAll('[data-edit]').forEach(a => a.addEventListener('click', (e) => { e.stopPropagation(); openAddrModal(addresses.find(x => x.id === a.dataset.edit)); }));
                    content.querySelectorAll('[data-del]').forEach(a => a.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const ok = await confirmDialog({ title: '删除地址', message: '确认删除该收货地址？', okText: '删除', danger: true });
                        if (!ok) return;
                        removeAddress(a.dataset.del);
                        addresses = getAddresses();
                        if (selectedAddr && selectedAddr.id === a.dataset.del) selectedAddr = defaultAddress();
                        render();
                    }));
                }
            }

            function openAddrModal(addr) {
                const overlay = openSheet(`
                    <h3 style="margin-bottom:1rem;">${addr ? '编辑地址' : '新增地址'}</h3>
                    <div class="form-field"><label>收货人</label><input id="aName" value="${escapeHtml(addr?.name || '')}" placeholder="姓名" /></div>
                    <div class="form-field"><label>手机号</label><input id="aPhone" value="${escapeHtml(addr?.phone || '')}" placeholder="手机号" /></div>
                    <div class="form-field"><label>详细地址</label><textarea id="aDetail" placeholder="省市区 + 详细地址">${escapeHtml(addr?.detail || '')}</textarea></div>
                    <div class="form-switch"><label><input type="checkbox" id="aDefault" ${addr?.isDefault ? 'checked' : ''} /> 设为默认地址</label></div>
                    <div class="form-error" id="aError"></div>
                    <div class="btn-group" style="margin-top:1rem;"><button class="btn btn--primary" style="flex:1;" id="aSave">保存</button><button class="btn btn--ghost" id="aCancel">取消</button></div>`);
                overlay.querySelector('#aCancel').addEventListener('click', () => closeSheet(overlay));
                overlay.querySelector('#aSave').addEventListener('click', () => {
                    const a = {
                        id: addr?.id,
                        name: overlay.querySelector('#aName').value.trim(),
                        phone: overlay.querySelector('#aPhone').value.trim(),
                        detail: overlay.querySelector('#aDetail').value.trim(),
                        isDefault: overlay.querySelector('#aDefault').checked
                    };
                    const err = overlay.querySelector('#aError');
                    if (!a.name || !a.phone || !a.detail) { err.textContent = '请填写完整收货地址'; return; }
                    addresses = saveAddress(a);
                    selectedAddr = a.isDefault ? a : addresses.find(x => x.id === a.id);
                    if (a.isDefault) localStorage.setItem('luminya-shop-address', a.id);
                    closeSheet(overlay);
                    render();
                });
            }

            async function submitOrder() {
                const errEl = document.getElementById('formError');
                const btn = document.getElementById('submitBtn');
                errEl.textContent = '';
                btn.disabled = true;

                const address = {};
                if (hasPhysical) {
                    if (!selectedAddr) { errEl.textContent = '请填写收货地址'; btn.disabled = false; return; }
                    address.name = selectedAddr.name;
                    address.phone = selectedAddr.phone;
                    address.detail = selectedAddr.detail;
                }

                const payload = {
                    items: buildItemsPayload(),
                    remark: document.getElementById('remark').value.trim(),
                    address,
                    pay_channel: payChannel
                };

                try {
                    const { order } = await api('/orders', { method: 'POST', body: payload });
                    let pay = null;
                    try {
                        const res = await api('/pay/create', { method: 'POST', body: { order_no: order.order_no } });
                        pay = res.pay;
                    } catch (e) { /* 占位 */ }

                    const settledKeys = new Set(items.map(i => i.key));
                    Store.cart = Store.cart.filter(i => !settledKeys.has(i.key));
                    saveCart();

                    if (pay && pay.pay_url) { location.href = pay.pay_url; }
                    else {
                        const modal = payUnavailableModal();
                        modal.querySelector('[data-close]').addEventListener('click', () => { modal.remove(); location.href = 'orders.html'; });
                    }
                } catch (e) {
                    errEl.textContent = e.message;
                    btn.disabled = false;
                }
            }
        })();
    </script>
</body>
</html>
