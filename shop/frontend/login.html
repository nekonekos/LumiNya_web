<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · LumiNya Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/shop.css" />
</head>
<body>
    <div class="container">
        <div id="pageContent"></div>
    </div>

    <script src="./js/shop.js"></script>
    <script>
        (async function () {
            await initCommon();
            const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
            const content = document.getElementById('pageContent');

            content.innerHTML = `
                <div class="form-card">
                    <h2>登录</h2>
                    <p class="hint">登录 LumiNya Shop 账号</p>
                    <div class="form-field"><label>邮箱</label><input id="email" type="email" placeholder="you@example.com" /></div>
                    <div class="form-field"><label>密码</label><input id="password" type="password" placeholder="••••••" /></div>
                    <div class="form-error" id="formError"></div>
                    <button class="btn btn--primary" id="loginBtn" style="width:100%;">登录</button>
                    <div class="form-switch">还没有账号？<a href="register.html?redirect=${encodeURIComponent(redirect)}">立即注册</a></div>
                </div>`;

            document.getElementById('loginBtn').addEventListener('click', async () => {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const errEl = document.getElementById('formError');
                errEl.textContent = '';
                if (!email || !password) { errEl.textContent = '请输入邮箱和密码'; return; }

                const btn = document.getElementById('loginBtn');
                btn.disabled = true;
                try {
                    const { token, user } = await api('/auth/login', { method: 'POST', body: { email, password } });
                    setToken(token);
                    setUser(user);
                    toast('登录成功');
                    setTimeout(() => { location.href = redirect; }, 500);
                } catch (e) {
                    errEl.textContent = e.message;
                    btn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
