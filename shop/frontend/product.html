<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品详情 · LumiNya Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/shop.css" />
</head>
<body>
    <div class="container">
        <div id="pageContent"></div>
    </div>

    <script src="./js/ui.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/shop.js"></script>
    <script>
        (async function () {
            await initCommon();
            const id = new URLSearchParams(location.search).get('id');
            const content = document.getElementById('pageContent');
            if (!id) {
                content.innerHTML = '<div class="empty-state">商品不存在</div>';
                return;
            }

            let product = null;
            let selectedVariant = null;
            let qty = 1;
            let images = [];
            let currentImage = 0;
            let categoryName = '';

            try {
                const data = await api(`/products/${encodeURIComponent(id)}`);
                product = data.product;
                images = product.images && product.images.length ? product.images : [''];
                try {
                    const { categories } = await api('/categories');
                    const cat = categories.find(c => c.id === product.category_id);
                    categoryName = cat ? cat.name : '';
                } catch {}
                render();
                renderRelated();
            } catch (e) {
                content.innerHTML = `<div class="empty-state">${escapeHtml(e.message)}</div>`;
                return;
            }

            function currentUnitPrice() { return selectedVariant ? selectedVariant.price : product.price; }
            function currentStock() { return selectedVariant ? selectedVariant.stock : product.stock; }
            function variantLabel() { return selectedVariant ? selectedVariant.name : '默认'; }

            function render() {
                document.title = `${product.title} · LumiNya Shop`;
                const variants = product.variants || [];
                const hasVariants = variants.length > 0;

                const breadcrumb = `<nav class="breadcrumb">
                    <a href="index.html">首页</a>
                    ${categoryName ? `› <a href="index.html?category=${encodeURIComponent(product.category_id)}">${escapeHtml(categoryName)}</a>` : ''}
                    › <span>${escapeHtml(product.title)}</span></nav>`;

                const slides = images.map((img, i) => `
                    <div class="slide" data-i="${i}">${img ? `<img src="${escapeHtml(img)}" alt="" />` : '🛍️'}</div>`).join('');

                const galleryHTML = `
                    <div class="gallery">
                        <div class="gallery-view swiper" id="galleryView">${slides}</div>
                        ${images.length > 1 ? `<div class="thumbs gallery-thumbs">${images.map((img, i) => `
                            <div class="t ${i === currentImage ? 'active' : ''}" data-i="${i}">${img ? `<img src="${escapeHtml(img)}" alt="" />` : '🛍️'}</div>`).join('')}</div>` : ''}
                    </div>`;

                const variantInline = hasVariants ? `
                    <div class="variant-list desktop-variants">${variants.map(v => `
                        <button class="variant-item ${!v.stock ? 'disabled' : ''}" data-vid="${escapeHtml(v.id)}" ${!v.stock ? 'disabled' : ''}>${escapeHtml(v.name || '默认')} · ${formatPrice(v.price)}</button>`).join('')}</div>` : '';

                const skuSheetBtn = hasVariants ? `
                    <button class="btn btn--outline sku-sheet-trigger" id="skuBtn">选择规格：<span id="skuSummary">${escapeHtml(variantLabel())}</span></button>` : '';

                content.innerHTML = `
                    ${breadcrumb}
                    <div class="product-detail">
                        ${galleryHTML}
                        <div class="detail-info">
                            <div class="badges">${product.type === 'physical' ? '<span class="badge badge--virtual">实物</span>' : '<span class="badge badge--virtual">虚拟</span>'}${product.stock === 0 ? '<span class="badge badge--soldout">已售罄</span>' : ''}</div>
                            <h1 class="title">${escapeHtml(product.title)}</h1>
                            <p class="summary">${escapeHtml(product.summary || '')}</p>
                            <div class="price" id="price">${formatPrice(product.price)}</div>
                            <div class="stock" id="stock">库存 ${product.stock}<span class="sold-line">已售 ${product.sold || 0}</span></div>
                            <div class="service-row">✅ 正品保障 · 🚚 极速发货 · 🔄 售后无忧</div>
                            ${variantInline}
                            ${skuSheetBtn}
                            <div class="qty-row">
                                <span>数量</span>
                                <div class="qty-stepper">
                                    <button id="qtyMinus">−</button><span class="qty-num" id="qtyNum">1</span><button id="qtyPlus">+</button>
                                </div>
                            </div>
                            <div class="detail-actions">
                                <button class="btn btn--outline" id="addCart">加入购物车</button>
                                <button class="btn btn--primary" id="buyNow">立即购买</button>
                            </div>
                        </div>
                    </div>

                    <div class="detail-tabs">
                        <button class="tab active" data-tab="desc">商品详情</button>
                        <button class="tab" data-tab="review">评价(0)</button>
                    </div>
                    <div class="tab-content">
                        <div id="tabDesc" class="tab-panel active">${escapeHtml(product.description || '暂无描述')}</div>
                        <div id="tabReview" class="tab-panel">${emptyState('暂无评价', { icon: '⭐' })}</div>
                    </div>

                    <div class="section-wrapper" id="related">
                        <div class="section-header"><h2 class="section-title">相关推荐</h2></div>
                        <div class="products-grid" id="relatedGrid"></div>
                    </div>

                    <div class="sticky-actionbar" id="stickyBar">
                        <a href="cart.html" class="bar-cart">🛒<b class="count cart-count" style="display:none">0</b>购物车</a>
                        <button class="btn btn--outline" id="mAddCart" style="flex:1;">加入购物车</button>
                        <button class="btn btn--primary" id="mBuyNow" style="flex:1;">立即购买</button>
                    </div>
                `;

                bindDetail();
                if (hasVariants && isMobileView()) bindSkuSheet(product.variants);
            }

            function bindDetail() {
                content.querySelectorAll('.gallery-thumbs .t').forEach(t => {
                    t.addEventListener('click', () => { currentImage = parseInt(t.dataset.i, 10); scrollToSlide(currentImage); });
                });
                const view = document.getElementById('galleryView');
                if (view) {
                    view.addEventListener('scroll', () => {
                        const idx = Math.round(view.scrollLeft / view.clientWidth);
                        if (idx !== currentImage) setActiveThumb(idx);
                    });
                    view.addEventListener('click', (e) => { if (!e.target.closest('img')) return; const img = images[currentImage]; if (img) openLightbox(img); });
                }
                document.getElementById('qtyMinus').addEventListener('click', () => setQty(qty - 1));
                document.getElementById('qtyPlus').addEventListener('click', () => setQty(qty + 1));

                content.querySelectorAll('.desktop-variants .variant-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.disabled) return;
                        selectedVariant = (product.variants || []).find(v => v.id === btn.dataset.vid);
                        updateActiveVariant();
                        refreshPriceStock();
                    });
                });

                [document.getElementById('addCart'), document.getElementById('mAddCart')].filter(Boolean)
                    .forEach(b => b.addEventListener('click', addCart));
                [document.getElementById('buyNow'), document.getElementById('mBuyNow')].filter(Boolean)
                    .forEach(b => b.addEventListener('click', buyNow));

                content.querySelectorAll('.detail-tabs .tab').forEach(t => {
                    t.addEventListener('click', () => {
                        content.querySelectorAll('.detail-tabs .tab').forEach(x => x.classList.toggle('active', x === t));
                        content.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab' + (t.dataset.tab === 'review' ? 'Review' : 'Desc')));
                    });
                });
            }

            function setActiveThumb(idx) {
                currentImage = idx;
                content.querySelectorAll('.gallery-thumbs .t').forEach(x => x.classList.toggle('active', parseInt(x.dataset.i, 10) === idx));
            }
            function scrollToSlide(i) {
                const view = document.getElementById('galleryView');
                if (!view) return;
                view.scrollTo({ left: i * view.clientWidth, behavior: 'smooth' });
                setActiveThumb(i);
            }
            function updateActiveVariant() {
                content.querySelectorAll('.variant-item').forEach(b => b.classList.toggle('active', b.dataset.vid === (selectedVariant ? selectedVariant.id : null)));
            }
            function openLightbox(img) {
                const modal = document.createElement('div');
                modal.className = 'modal-backdrop';
                modal.style.background = 'rgba(0,0,0,0.85)';
                modal.innerHTML = `<div class="lightbox"><img src="${escapeHtml(img)}" alt="" /><button class="drawer-close" data-close>✕</button></div>`;
                document.body.appendChild(modal);
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
                modal.querySelector('[data-close]').addEventListener('click', () => modal.remove());
            }

            function bindSkuSheet(variants) {
                const btn = document.getElementById('skuBtn');
                if (!btn) return;
                btn.addEventListener('click', () => {
                    let chosen = selectedVariant;
                    let sheetQty = qty;
                    const overlay = openSheet(`
                        <h3 style="margin-bottom:1rem;">选择规格</h3>
                        <div class="variant-list sheet-list">${variants.map(v => `
                            <button class="variant-item ${!v.stock ? 'disabled' : ''} ${chosen && chosen.id === v.id ? 'active' : ''}" data-vid="${escapeHtml(v.id)}" ${!v.stock ? 'disabled' : ''}>${escapeHtml(v.name || '默认')} · ${formatPrice(v.price)}</button>`).join('')}</div>
                        <div class="qty-row" style="margin-top:1.2rem;"><span>数量</span>
                            <div class="qty-stepper"><button data-sm>−</button><span class="qty-num" data-qnum>${qty}</span><button data-sp>+</button></div>
                        </div>
                        <div class="btn-group" style="margin-top:1.4rem;"><button class="btn btn--primary" style="flex:1;" data-sheet-ok>确定</button></div>`);
                    overlay.querySelectorAll('.sheet-list .variant-item').forEach(b => {
                        b.addEventListener('click', () => { if (b.disabled) return; chosen = variants.find(v => v.id === b.dataset.vid); overlay.querySelectorAll('.sheet-list .variant-item').forEach(x => x.classList.toggle('active', x === b)); });
                    });
                    overlay.querySelector('[data-sm]').addEventListener('click', () => { sheetQty = Math.max(1, sheetQty - 1); overlay.querySelector('[data-qnum]').textContent = sheetQty; });
                    overlay.querySelector('[data-sp]').addEventListener('click', () => { const max = Math.max(1, chosen ? chosen.stock : product.stock); sheetQty = Math.min(sheetQty + 1, max); overlay.querySelector('[data-qnum]').textContent = sheetQty; });
                    overlay.querySelector('[data-sheet-ok]').addEventListener('click', () => {
                        selectedVariant = chosen || null;
                        qty = sheetQty;
                        document.getElementById('skuSummary').textContent = variantLabel();
                        updateActiveVariant();
                        refreshPriceStock();
                        document.getElementById('qtyNum').textContent = qty;
                        closeSheet(overlay);
                    });
                });
            }

            function addCart() {
                if (currentStock() < qty) return toast('库存不足', 'err');
                addToCart(product, selectedVariant, qty);
                flyToCart(content.querySelector('.gallery-view'));
                toast('已加入购物车');
            }
            function buyNow() {
                if (currentStock() < qty) return toast('库存不足', 'err');
                if (!isLoggedIn()) {
                    toast('请先登录', 'err');
                    setTimeout(() => { location.href = 'login.html?redirect=checkout.html'; }, 600);
                    return;
                }
                Store.cart = Store.cart.filter(i => !i.buynow);
                addToCart(product, selectedVariant, qty);
                const key = selectedVariant ? `${product.id}:${selectedVariant.id}` : product.id;
                const item = Store.cart.find(i => i.key === key);
                if (item) item.buynow = true;
                saveCart();
                location.href = 'checkout.html?buynow=1';
            }

            function refreshPriceStock() {
                const priceEl = document.getElementById('price');
                const stockEl = document.getElementById('stock');
                priceEl.textContent = formatPrice(currentUnitPrice());
                const stock = currentStock();
                stockEl.innerHTML = `库存 ${stock}<span class="sold-line">已售 ${product.sold || 0}</span>`;
                stockEl.className = `stock ${stock <= 0 ? 'out' : ''}`;
            }

            function setQty(n) {
                qty = Math.max(1, Math.min(n, Math.max(currentStock(), 1)));
                document.getElementById('qtyNum').textContent = qty;
            }

            async function renderRelated() {
                const grid = document.getElementById('relatedGrid');
                try {
                    const qs = product.category_id ? `?category=${encodeURIComponent(product.category_id)}` : '';
                    const { results } = await api(`/products${qs}`);
                    const rel = (results || []).filter(r => r.id !== product.id).slice(0, 4);
                    if (!rel.length) { document.getElementById('related').style.display = 'none'; return; }
                    grid.innerHTML = rel.map(productCardHTML).join('');
                    bindProductCards(grid);
                } catch (e) { document.getElementById('related').style.display = 'none'; }
            }
        })();
    </script>
</body>
</html>
