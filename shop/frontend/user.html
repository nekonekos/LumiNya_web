<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的淘宝 · LumiNya Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/shop.css" />
</head>
<body>
    <div class="container">
        <div id="pageContent"></div>
    </div>

    <script src="./js/ui.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/shop.js"></script>
    <script>
        (async function () {
            await initCommon();
            if (!isLoggedIn()) {
                toast('请先登录', 'err');
                setTimeout(() => { location.href = 'login.html?redirect=user.html'; }, 600);
                return;
            }
            const content = document.getElementById('pageContent');
            let user = getUser();
            try { const { user: me } = await api('/auth/me'); user = me; } catch {}
            let addresses = getAddresses();
            let orders = [];

            try { const { orders: os } = await api('/orders'); orders = os || []; } catch {}

            render();

            function counts() {
                const c = { pending: 0, paid: 0, shipped: 0, completed: 0, after: 0 };
                orders.forEach(o => {
                    if (['applied', 'processing'].includes(o.after_sale_status)) c.after++;
                    else if (c[o.status] !== undefined) c[o.status]++;
                });
                return c;
            }

            function render() {
                const c = counts();
                const entries = [
                    { label: '待付款', icon: '💰', href: 'orders.html?status=pending' },
                    { label: '待发货', icon: '📦', href: 'orders.html?status=paid' },
                    { label: '待收货', icon: '🚚', href: 'orders.html?status=shipped' },
                    { label: '已完成', icon: '✅', href: 'orders.html?status=completed' },
                    { label: '售后', icon: '🛠️', href: 'orders.html?status=after' }
                ];
                content.innerHTML = `
                    <div class="section-wrapper">
                        <div class="user-card">
                            <div class="avatar">${escapeHtml((user.display_name || user.email || '?').slice(0, 1).toUpperCase())}</div>
                            <div class="user-info">
                                <div class="u-name">${escapeHtml(user.display_name || user.email)}</div>
                                <div class="u-email">${escapeHtml(user.email)}</div>
                            </div>
                            <a href="index.html" class="btn btn--ghost btn--small">返回商城</a>
                        </div>

                        <div class="card">
                            <div class="card-head"><h3>我的订单</h3><a href="orders.html" class="link">全部订单 ›</a></div>
                            <div class="order-entries">
                                ${entries.map(e => `<a href="${e.href}" class="entry"><span class="entry-icon">${e.icon}<b class="order-count" style="display:none">0</b></span><label>${e.label}</label></a>`).join('')}
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-head"><h3>收货地址</h3><button class="btn btn--ghost btn--small" id="newAddr">＋ 新增</button></div>
                            <div id="addrList"></div>
                        </div>

                        <div class="card menu-list">
                            <a href="orders.html" class="menu-row">🧾 全部订单</a>
                            <button class="menu-row" data-addr>📍 收货地址</button>
                            <button class="menu-row" disabled>🔒 账户安全（即将上线）</button>
                            <button class="menu-row" id="logoutBtn">🚪 退出登录</button>
                        </div>
                    </div>`;
                renderCounts(c);
                renderAddrs();
                bind();
            }

            function renderCounts(c) {
                const map = { '待付款': 'pending', '待发货': 'paid', '待收货': 'shipped', '已完成': 'completed', '售后': 'after' };
                document.querySelectorAll('.order-entries .entry').forEach(e => {
                    const label = e.querySelector('label').textContent;
                    const n = c[map[label]] || 0;
                    const badge = e.querySelector('.order-count');
                    if (badge) { badge.textContent = n; badge.style.display = n > 0 ? 'flex' : 'none'; }
                });
            }

            function renderAddrs() {
                const wrap = document.getElementById('addrList');
                if (!wrap) return;
                if (!addresses.length) { wrap.innerHTML = '<div class="empty-state" style="padding:1rem;">暂无收货地址</div>'; return; }
                wrap.innerHTML = addresses.map(a => `
                    <div class="address-card" data-id="${escapeHtml(a.id)}">
                        <input type="radio" name="addr" ${a.isDefault ? 'checked' : ''} disabled />
                        <div class="addr-main">
                            <div class="addr-line">${escapeHtml(a.name || '')} ${escapeHtml(a.phone || '')}${a.isDefault ? '<span class="badge badge--new">默认</span>' : ''}</div>
                            <div class="addr-detail">${escapeHtml(a.detail || '')}</div>
                        </div>
                        <div class="addr-actions"><a data-edit="${escapeHtml(a.id)}">编辑</a><a data-del="${escapeHtml(a.id)}">删除</a></div>
                    </div>`).join('');
                wrap.querySelectorAll('[data-edit]').forEach(a => a.addEventListener('click', (e) => { e.stopPropagation(); openAddrModal(addresses.find(x => x.id === a.dataset.edit)); }));
                wrap.querySelectorAll('[data-del]').forEach(a => a.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const ok = await confirmDialog({ title: '删除地址', message: '确认删除该收货地址？', okText: '删除', danger: true });
                    if (!ok) return;
                    removeAddress(a.dataset.del);
                    addresses = getAddresses();
                    renderAddrs();
                }));
            }

            function bind() {
                const newBtn = document.getElementById('newAddr');
                if (newBtn) newBtn.addEventListener('click', () => openAddrModal());
                const logout = document.getElementById('logoutBtn');
                if (logout) logout.addEventListener('click', () => { setToken(''); setUser(null); toast('已退出登录'); setTimeout(() => { location.href = 'login.html'; }, 600); });
                const menu = document.querySelector('[data-addr]');
                if (menu) menu.addEventListener('click', () => document.getElementById('addrList').scrollIntoView({ behavior: 'smooth' }));
            }

            function openAddrModal(addr) {
                const overlay = openSheet(`
                    <h3 style="margin-bottom:1rem;">${addr ? '编辑地址' : '新增地址'}</h3>
                    <div class="form-field"><label>收货人</label><input id="aName" value="${escapeHtml(addr?.name || '')}" placeholder="姓名" /></div>
                    <div class="form-field"><label>手机号</label><input id="aPhone" value="${escapeHtml(addr?.phone || '')}" placeholder="手机号" /></div>
                    <div class="form-field"><label>详细地址</label><textarea id="aDetail" placeholder="省市区 + 详细地址">${escapeHtml(addr?.detail || '')}</textarea></div>
                    <div class="form-switch"><label><input type="checkbox" id="aDefault" ${addr?.isDefault ? 'checked' : ''} /> 设为默认地址</label></div>
                    <div class="form-error" id="aError"></div>
                    <div class="btn-group" style="margin-top:1rem;"><button class="btn btn--primary" style="flex:1;" id="aSave">保存</button><button class="btn btn--ghost" id="aCancel">取消</button></div>`);
                overlay.querySelector('#aCancel').addEventListener('click', () => closeSheet(overlay));
                overlay.querySelector('#aSave').addEventListener('click', () => {
                    const a = {
                        id: addr?.id,
                        name: overlay.querySelector('#aName').value.trim(),
                        phone: overlay.querySelector('#aPhone').value.trim(),
                        detail: overlay.querySelector('#aDetail').value.trim(),
                        isDefault: overlay.querySelector('#aDefault').checked
                    };
                    const err = overlay.querySelector('#aError');
                    if (!a.name || !a.phone || !a.detail) { err.textContent = '请填写完整收货地址'; return; }
                    addresses = saveAddress(a);
                    closeSheet(overlay);
                    renderAddrs();
                });
            }
        })();
    </script>
</body>
</html>
